<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>أبيلا — خطط العمل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F2EA; --card:#FFFFFF; --ink:#3E2C1C; --ink2:#5C4528; --mute:#9A8670; --brown:#8B6F47;
  --gold:#B8975D; --gold-l:#D4B97A; --cream:#F3ECDD; --cream2:#FBF8F2; --line:#EBE1CF;
  --red:#A04545; --red-bg:#F7E9E6; --green:#4E7A57; --green-bg:#E8F1E8; --amber:#B07A2A; --amber-bg:#FBF1DE;
  --blue:#4A6A8A; --blue-bg:#E7EEF5;
  --r:16px; --sh:0 1px 2px rgba(62,44,28,.05),0 6px 22px rgba(62,44,28,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal','Segoe UI',system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
a{color:var(--brown)}
.hide{display:none!important}

/* shell */
.top{position:sticky;top:0;z-index:40;background:rgba(247,242,234,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 18px}
.top img{width:40px;height:40px;object-fit:contain}
.top h1{margin:0;font-size:17px;font-weight:800;color:var(--ink2);line-height:1.15}
.top small{display:block;font-size:12px;color:var(--mute);font-weight:500}
.me{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);background:var(--card);border:1px solid var(--line);padding:5px 12px 5px 5px;border-radius:99px;white-space:nowrap}
.me i{width:26px;height:26px;border-radius:50%;background:var(--brown);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px}
main{max-width:1080px;margin:auto;padding:18px 18px 120px}

/* steps bar */
.stepsbar{position:sticky;top:61px;z-index:30;background:var(--bg);padding:10px 0 8px;margin:0 -18px 12px;padding-inline:18px;border-bottom:1px solid var(--line)}
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px 7px 9px;font-weight:700;font-size:13px;color:var(--ink2);cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.steps button b{width:22px;height:22px;border-radius:50%;background:var(--cream);display:grid;place-items:center;font-size:11.5px;color:var(--brown)}
.steps button.on{background:var(--ink2);border-color:var(--ink2);color:#fff}
.steps button.on b{background:var(--gold);color:#fff}
.steps button .cnt{font-size:11px;background:var(--cream);color:var(--brown);border-radius:99px;padding:1px 7px}
.steps button.on .cnt{background:rgba(255,255,255,.2);color:#fff}

/* type */
.h{font-size:22px;font-weight:800;margin:4px 0 4px;color:var(--ink)}
.sub{color:var(--mute);margin:0 0 16px;font-size:14px;line-height:1.6}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 10px;flex-wrap:wrap}
.sec b{font-size:16px;color:var(--ink2)}
.sec span{font-size:13px;color:var(--mute)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:760px){.grid3,.grid4{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--cream);color:var(--ink2);white-space:nowrap}
.pill.red{background:var(--red-bg);color:var(--red)} .pill.green{background:var(--green-bg);color:var(--green)}
.pill.amber{background:var(--amber-bg);color:var(--amber)} .pill.gold{background:#F4EBD6;color:#8A6A2E} .pill.blue{background:var(--blue-bg);color:var(--blue)}

/* form */
label.f{display:block}
label.f>span{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:0 2px 5px}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--cream2);border-radius:12px;padding:10px 12px;outline:0;transition:.12s}
.in:focus{border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(212,185,122,.25)}
textarea.in{min-height:64px;resize:vertical;line-height:1.6}
.in.sm{padding:7px 10px;border-radius:10px;font-size:14px}
.qty{max-width:110px}
.chk{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;color:var(--ink2);cursor:pointer;user-select:none}
.chk input{width:18px;height:18px;accent-color:var(--brown)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:var(--ink2);transition:.12s;white-space:nowrap}
.btn:hover{border-color:var(--gold-l)}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--brown);border-color:var(--brown);color:#fff}
.btn.pri:hover{background:var(--ink2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--brown)}
.btn.red{color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{border:0;background:none;padding:6px;border-radius:9px;cursor:pointer;color:var(--mute);display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--cream);color:var(--red)}
.icon-btn svg{width:18px;height:18px}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--ink2);transition:.1s;user-select:none}
.chip.on{background:var(--ink2);border-color:var(--ink2);color:#fff}
.chip.paint{direction:ltr}
.chipin{display:inline-flex;border:1px dashed var(--gold-l);border-radius:99px;padding:0 4px 0 10px;align-items:center;background:var(--cream2)}
.chipin input{border:0;outline:0;background:none;width:96px;padding:5px 0;font-size:12.5px}
.seg{display:inline-flex;background:var(--cream);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink2);cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);color:var(--brown)}

/* rows */
.rows{display:grid;gap:12px}
.row{padding:14px;position:relative}
.row-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.row-h .n{width:26px;height:26px;border-radius:8px;background:var(--cream);color:var(--brown);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
.row-h .t{font-weight:800;color:var(--ink);flex:1;min-width:120px}
.row-h .code{font-family:ui-monospace,Consolas,monospace;font-size:12px;font-weight:700;background:var(--ink2);color:#fff;padding:2px 8px;border-radius:7px;direction:ltr}
.row .src{font-size:12px;color:var(--mute);background:var(--cream2);border:1px dashed var(--line);border-radius:10px;padding:6px 10px;margin-top:10px;line-height:1.6}
.row.auto{border-inline-start:4px solid var(--gold-l)}
.addbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pd{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.pd label{display:flex;flex-direction:column;align-items:center;font-size:11.5px;font-weight:700;color:var(--mute);gap:3px}.pd input{width:58px;text-align:center}.pd .tot{font-weight:800;color:var(--brown);font-size:13px;padding-top:14px}
.fx{margin-top:10px;padding:10px 12px;border:1px dashed var(--gold-l);border-radius:12px;background:var(--cream2)}
.sumed{width:100%;border-collapse:collapse}.sumed td,.sumed th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:start;font-size:13.5px}.sumed th{color:var(--mute);font-size:12px}.sumed input{width:100%}
.hint{font-size:12px;color:var(--mute);margin-top:4px}

/* photos */
.ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.ph .th{width:74px;height:74px;border-radius:12px;overflow:hidden;position:relative;background:var(--cream);border:1px solid var(--line)}
.ph .th img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.ph .th button{position:absolute;top:3px;inset-inline-end:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(62,44,28,.75);color:#fff;font-size:13px;line-height:22px;cursor:pointer;padding:0}
.ph .addph{width:74px;height:74px;border-radius:12px;border:1.5px dashed var(--gold-l);background:var(--cream2);color:var(--brown);display:grid;place-items:center;cursor:pointer;font-size:11.5px;font-weight:700;text-align:center;line-height:1.3}

/* contract lines */
.cl{display:flex;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);align-items:flex-start}
.cl:last-child{border-bottom:0}
.cl .q{flex:none;min-width:34px;text-align:center;font-weight:800;color:var(--brown);background:var(--cream);border-radius:9px;padding:3px 6px;font-size:13px}
.cl .tx{flex:1;line-height:1.7;font-size:14px}
.cl.cancel .tx{text-decoration:line-through;color:var(--mute)}
.cl .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.cl select{max-width:160px}

/* list */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;box-shadow:var(--sh)}
.search svg{width:19px;height:19px;color:var(--mute);flex:none}
.search input{border:0;outline:0;background:none;padding:13px 0;width:100%;font-size:15.5px}
.ops{display:grid;gap:10px;margin-top:14px}
.op{display:flex;align-items:center;gap:14px;padding:13px 15px;cursor:pointer;transition:.12s}
.op:hover{border-color:var(--gold-l);transform:translateY(-1px)}
.op .code{flex:none;width:70px;text-align:center;padding:8px 0;border-radius:12px;background:var(--cream);font-weight:800;color:var(--brown);font-size:15px;direction:ltr}
.op .code small{display:block;font-size:10.5px;color:var(--mute);font-weight:600}
.op .mid{flex:1;min-width:0}
.op .nm{font-weight:800;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op .ln{color:var(--mute);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op .end{text-align:end;flex:none;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.empty{text-align:center;color:var(--mute);padding:40px 10px}

/* client card */
.client{padding:16px 18px;background:linear-gradient(135deg,#5C4528,#8B6F47);color:#fff;border:0;border-radius:20px;position:relative;overflow:hidden;margin-bottom:14px}
.client::after{content:"";position:absolute;inset-inline-start:-50px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(212,185,122,.35),transparent 70%)}
.client .r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.client .cd{background:rgba(255,255,255,.16);padding:3px 10px;border-radius:9px;font-weight:800;direction:ltr;font-size:13px}
.client h2{margin:0;font-size:20px;font-weight:800;flex:1;min-width:140px}
.client .r2{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:13px;opacity:.92}
.client .st{background:#fff;color:var(--ink2);padding:3px 10px;border-radius:99px;font-weight:800;font-size:12px}

/* bottom bar */
.bbar{position:fixed;bottom:0;inset-inline:0;z-index:35;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bbar-in{max-width:1080px;margin:auto;display:flex;gap:8px;align-items:center}
.bbar .dirty{font-size:12.5px;color:var(--amber);font-weight:700}
.bbar .grow{flex:1}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(40,28,16,.45);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:760px){.modal{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:1000px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:760px){.sheet{border-radius:22px;max-height:88vh}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.sheet-h b{font-size:16px;flex:1}
.sheet-b{flex:1;overflow:auto;padding:14px 16px}
.sheet-f{padding:12px 16px;border-top:1px solid var(--line);background:var(--card);display:flex;gap:8px;align-items:center}
.picker{display:grid;grid-template-columns:250px 1fr;gap:14px;min-height:0}
@media(max-width:700px){.picker{grid-template-columns:1fr}}
.cat{display:flex;flex-direction:column;gap:3px;max-height:68vh;overflow:auto}
@media(max-width:700px){.cat{max-height:none;flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.cat .wh{font-size:11.5px;font-weight:800;color:var(--mute);margin:10px 6px 4px}
.cat button{border:0;background:none;text-align:start;padding:7px 10px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13.5px;color:var(--ink2);display:flex;gap:8px;align-items:center;white-space:nowrap}
.cat button code{font-size:11px;color:var(--brown);background:var(--cream);padding:1px 6px;border-radius:6px;direction:ltr}
.cat button.on{background:var(--ink2);color:#fff}
.cat button.on code{background:rgba(255,255,255,.2);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.pgrid .p{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;cursor:pointer;background:var(--cream);border:2px solid transparent}
.pgrid .p img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.pgrid .p.on{border-color:var(--brown)}
.pgrid .p.on::after{content:"✓";position:absolute;top:6px;inset-inline-end:6px;width:24px;height:24px;border-radius:50%;background:var(--brown);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.pgrid .p .zoom{position:absolute;bottom:5px;inset-inline-start:5px;border:0;width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.85);cursor:pointer;font-size:13px}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.85);display:grid;place-items:center;cursor:zoom-out}
.lightbox img{max-width:94vw;max-height:90vh;border-radius:10px}

/* review */
.docs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.frame{width:100%;height:72vh;border:1px solid var(--line);border-radius:14px;background:#fff}
.warn{background:var(--amber-bg);color:#7a5418;border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.8;margin-bottom:12px}
.warn.red{background:var(--red-bg);color:var(--red)}
.ok{background:var(--green-bg);color:var(--green);border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.8;margin-bottom:12px}
.vlist{display:grid;gap:8px}
.ver{display:flex;gap:10px;align-items:center;padding:10px 12px}
.ver .vn{font-weight:800;color:var(--brown);background:var(--cream);border-radius:9px;padding:4px 9px;direction:ltr}
.ver .vm{flex:1;font-size:13px;color:var(--mute);line-height:1.6}
.ver .vm b{color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--cream);color:var(--ink2);font-weight:800;text-align:start;padding:8px 10px;font-size:12.5px}
.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top}
.tbl tr.off td{color:var(--mute);text-decoration:line-through}

.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:90;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.toast.err{background:var(--red)}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--mute);gap:12px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brown);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.busy{position:fixed;inset:0;z-index:95;background:rgba(247,242,234,.75);display:grid;place-items:center;font-weight:800;color:var(--ink2)}
.busy>div{display:grid;place-items:center;gap:12px;text-align:center}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:30px;line-height:1.8}
.stats{grid-template-columns:repeat(3,1fr)!important}.stats .pad{padding:10px 12px}.stats .h{font-size:19px}

</style>
</head>
<body>
<div class="top"><div class="top-in">
  <img id="logo" alt="Abella">
  <div><h1>خطط العمل</h1><small>شركة أبيلا للأفراح والمناسبات</small></div>
  <div class="me"><i id="meI">م</i><div><b id="meName">…</b><small id="meRole" style="display:block;font-size:11px;color:var(--mute)"></small></div></div>
</div></div>
<main id="app"></main>
<div class="bbar hide" id="bbar"><div class="bbar-in">
  <button class="btn" id="bPrev" data-act="prev">→ السابق</button>
  <span class="dirty" id="dirty"></span><span class="grow"></span>
  <button class="btn pri" id="bSave" data-act="save">حفظ</button>
  <button class="btn gold" id="bNext" data-act="next">التالي ←</button>
</div></div>
<script src="/assets/session.js"></script>

async function openContract(Q) {

    S.cur = { c, plan, versions: d.versions || [], meta: d.meta, base: plan.version || 0, dirty: fresh, viewing: 0 };

/* ─── 8) المشتريات ─── */
function derivePurchases(P) {
  const out = [];
  const push = (key, sec, item, qty, unit, supplier, desc) => out.push({ key, sec, item, qty, unit, supplier, desc, skip: !!(P.buySkip || {})[key] });
  P.natural.forEach(r => { if (!r.buy) return; push('n' + r.id, 'ورد طبيعي', 'ورد طبيعي — ' + (r.types.join('، ') || 'يحدد'), r.qty, r.method === 'فوم' ? 'تنسيق فوم' : 'تنسيق', '', [r.area, r.colors.join('، '), r.density].filter(Boolean).join(' · ')); });
  P.artificial.forEach(r => { if (!r.buy) return; push('a' + r.id, 'ورد صناعي', 'ورد صناعي — ' + (r.types.join('، ') || 'يحدد'), r.qty, '', '', [r.area, r.colors.join('، ')].filter(Boolean).join(' · ')); });
  P.hosp.forEach(r => {
    if (!r.buy) return;
    const kg = num(r.qty) && num(r.kg) ? ` — ${num(r.qty) * num(r.kg)} كجم` : '';
    push('h' + r.id, 'الضيافة', r.item, r.qty, r.unit, r.supplier, (r.desc || '') + kg);
  });
  P.amen.forEach(r => { if (r.buy) push('m' + r.id, 'الكماليات', r.nameAr, r.qty, '', '', [r.code, r.color, r.desc].filter(Boolean).join(' · ')); });
  P.decor.forEach(r => { if (r.buy) push('d' + r.id, 'الديكور', r.item, r.qty, '', '', [r.code, (r.paints || []).join('، '), r.desc].filter(Boolean).join(' · ')); });
  (P.buyManual || []).forEach(r => out.push(Object.assign({ key: 'x' + r.id, manual: true, skip: false }, r)));
  return out;
}
function stepBuy() {
  const P = CUR(); const rows = derivePurchases(P);
  return `<h2 class="h">المشتريات</h2><p class="sub">مشتقة تلقائياً من بنود الخطة المعلّمة «يحتاج شراء» (الورد الطبيعي، التشوكلت والموالح…). ألغِ أي سطر لا يحتاج شراء، أو أضف بنوداً يدوية.</p>
    <div class="card" style="overflow:auto"><table class="tbl"><thead><tr><th></th><th>القسم</th><th>البند</th><th>الكمية</th><th>المورد</th><th>تفاصيل</th></tr></thead><tbody>

      <div class="grid4">${fld('البند', inp(`buyManual|${r.id}|item`, r.item))}${fld('الكمية', inp(`buyManual|${r.id}|qty`, r.qty, '', 'num'))}
      ${fld('الوحدة', `<input class="in" list="dlUnits2" data-b="buyManual|${r.id}|unit" value="${esc(r.unit)}">`)}${fld('المورد', inp(`buyManual|${r.id}|supplier`, r.supplier))}</div>
      <div class="grid2" style="margin-top:10px">${fld('القسم', inp(`buyManual|${r.id}|sec`, r.sec, 'مثال: مستهلكات'))}${fld('ملاحظات', inp(`buyManual|${r.id}|desc`, r.desc))}</div></div>`).join('')}</div>
    ${dl('dlUnits2', L('الوحدات'))}`;

/* ─── 9) المراجعة والاعتماد ─── */
function validate(P) {
  const w = [];
  if (!P.opsManager) w.push('لم يُحدَّد مدير التشغيل');
  if (!P.projectManager) w.push('لم تُحدَّد مديرة المشروع');
  const unc = P.contract.filter(l => l.status !== 'cancelled' && l.cat === 'general');
  if (unc.length) w.push(`بنود عقد غير مصنّفة (${unc.length}): ` + unc.map(l => '«' + l.text.slice(0, 40) + '»').join('، '));
  const nf = P.natural.filter(r => !r.types.length || !r.colors.length);
  if (nf.length) w.push('ورد طبيعي بدون نوع/لون: ' + nf.map(r => r.area || '—').join('، '));
  const ch = P.hosp.filter(r => (r.sec === 'choc' || r.sec === 'salty') && (!r.supplier || /تحدد/.test(r.supplier)));
  if (ch.length) w.push('مورد التشوكلت/الموالح لم يُحسم: ' + ch.map(r => r.item).join('، '));
  const kg = P.hosp.filter(r => (r.sec === 'choc' || r.sec === 'salty') && !num(r.kg));
  if (kg.length) w.push('الكيلو غير محدد: ' + kg.map(r => r.item).join('، '));

  const ckHosp = () => {
    const it = []; const d = nDays(P);
    P.hosp.filter(isStaff).forEach(r => { syncPer(r, P); r.perDay.forEach((q, i) => { if (q) it.push({ sec: d > 1 ? 'حضور الطاقم — اليوم ' + (i + 1) : 'حضور الطاقم', name: r.item, sub: C(r.supplier || ''), qty: q, photos: [] }); }); });

      ckSum(it.length, false, ['جاهز', 'موجود', 'رجع']), '', [['مشرفة الضيافة', ''], ['مدير التشغيل', P.opsManager], ['مديرة المشروع', P.projectManager]]);

  const ckBuy = () => {

    return shell('قائمة تحقق — المشتريات', 'تشك ليست المشتريات', ckHead(false, ['تاريخ الشراء', 'المندوب', 'إجمالي الفواتير']) + `<div class="sec">البنود</div>` +
      ckTable(it, [['الشراء', ['تم الطلب', 'تم الشراء', 'الفاتورة']], ['الاستلام', ['استُلم', 'مطابق']]]) +
      ckSum(it.length, false, ['تم الشراء', 'استُلم']), '', [['المندوب', ''], ['المدير المالي', ''], ['مدير التشغيل', P.opsManager]]);
  };

  const D = {};
  D.ck_factory = { title: 'قائمة تحقق — المصنع', html: ckFactory() };

  D.factory = { title: 'خطة عمل — الإنجاز من المصنع', html: shell('خطة عمل — الإنجاز من المصنع', 'المصنع', `
    <div class="sec">الاسم والاستيكر والألوان</div>${nameBlock()}
    <div class="sec">بنود التصنيع والديكور</div>${decorTbl()}
    <div class="sec">الورد الصناعي</div>${flowerTbl('artificial')}

    ${factTbl() ? `<div class="sec">قطع من الكماليات والضيافة تُشطّب في المصنع</div>${factTbl()}` : ''}
    <div class="sec">كتالوج البوية</div>${paintCatalog()}`) };
  D.amenities = { title: 'Work Plan — Amenities', html: shell('Work Plan — Amenities (Warehouse)', 'Amenities', `
    ${P.baby.nameEn || P.baby.nameAr ? `<div class="sec">Baby Name</div><table class="it"><tr><td dir="ltr"><b style="font-size:13pt">${C(P.baby.nameEn || '')}</b></td><td dir="rtl"><b style="font-size:13pt">${C(P.baby.nameAr || '')}</b></td></tr></table>` : ''}
    <div class="sec">Amenities List</div>${amenEn()}
    ${P.notes ? `<div class="sec">Notes</div><div>${C(P.notes)}</div>` : ''}`, 'en') };
  D.hospitality = { title: 'خطة عمل — الضيافة', html: shell('خطة عمل — الضيافة', 'الضيافة', `
    <div class="sec">ملخص الضيافة</div>${hospSummary()}${hospSecs()}${hospTools()}`) };
  D.purchases = { title: 'خطة عمل — المشتريات', html: shell('خطة عمل — المشتريات', 'المشتريات', purchTbl()) };
  D.full = { title: 'خطة العمل الكاملة', html: shell('خطة العمل الكاملة', '', `
    ${P.notes ? `<div class="sec">ملاحظات عامة</div><div>${C(P.notes)}</div>` : ''}
    <div class="sec">بنود العقد</div>${contractList()}

    <div class="sec">الورد الطبيعي</div>${flowerTbl('natural')}
    <div class="sec">الورد الصناعي</div>${flowerTbl('artificial')}
    <div class="sec">الاسم والاستيكر</div>${nameBlock()}
    ${fabricTbl() ? `<div class="sec">القماش</div>${fabricTbl()}` : ''}
    <div class="sec">الكماليات</div>${amenAr()}
    <div class="sec">الديكور وكود البوية</div>${decorTbl()}
    <div class="sec">كتالوج البوية</div>${paintCatalog()}

  return D;
}

/* ═══════════════ منتقي الصور ═══════════════ */
let PK = null;
async function openPicker(target) {
  PK = { target, folder: null, sel: [], q: '' };
  if (!S.catalog) { busy('تحميل الكتالوج…'); try { S.catalog = await call('api_catalog'); } catch (e) { busy(false); return toast(e.message, true); } busy(false); }
  const code = target.code; const f = S.catalog.find(c => c.code === code) || (target.mode === 'amen' ? S.catalog.find(c => /^(HOS|ACC)/.test(c.code)) : null) || S.catalog[0];
  renderPicker(); if (f) pickFolder(f.folderId);
}
function renderPicker() {
  let m = $('#modal'); if (!m) { m = document.createElement('div'); m.id = 'modal'; m.className = 'modal'; document.body.appendChild(m); }
  const groups = {}; (S.catalog || []).forEach(c => { const g = c.wh + ' / ' + (c.mainCode ? c.mainCode + ' ' : '') + c.main; (groups[g] = groups[g] || []).push(c); });
  const f = PK.folder ? S.catalog.find(c => c.folderId === PK.folder) : null;
  const ph = PK.folder ? S.photos[PK.folder] : null;
  m.innerHTML = `<div class="sheet">
    <div class="sheet-h"><b>${PK.target.mode === 'amen' ? 'إضافة كماليات من الكتالوج' : 'اختيار الصور'}${f ? ` — <span class="code" style="font-size:12px;background:var(--ink2);color:#fff;padding:2px 7px;border-radius:6px">${esc(f.code)}</span> ${esc(f.name)}` : ''}</b>
      <button class="btn sm" data-act="refreshCat">${IC.refresh}</button><button class="icon-btn" data-act="closePicker">${IC.x}</button></div>
    <div class="sheet-b"><div class="picker">
      <div class="cat">${Object.keys(groups).map(g => `<div class="wh">${esc(g)}</div>${groups[g].map(c => `<button class="${c.folderId === PK.folder ? 'on' : ''}" data-folder="${c.folderId}"><code>${esc(c.code || '—')}</code>${esc(c.name)}</button>`).join('')}`).join('')}</div>
      <div>${!PK.folder ? '<div class="empty">اختر تصنيفاً</div>' : !ph ? '<div class="loading" style="min-height:30vh"><div class="spin"></div></div>' : ph.length ?
        `<div class="pgrid">${ph.map(p => `<div class="p ${PK.sel.find(x => x.id === p.id) ? 'on' : ''}" data-pick="${p.id}">${imgTag(p.id, 300)}<button class="zoom" data-zoom="${p.id}">🔍</button></div>`).join('')}</div>` : '<div class="empty">المجلد فاضي — ارفع صورة من الجهاز أو اختر تصنيفاً آخر</div>'}</div>
    </div></div>
    <div class="sheet-f"><label class="btn">${IC.img} رفع من الجهاز<input type="file" accept="image/*" multiple id="upl" style="display:none"></label>
      <span class="grow" style="flex:1;font-size:13px;color:var(--mute)">${PK.sel.length ? 'تم اختيار ' + PK.sel.length : ''}</span>
      <button class="btn pri" data-act="pickDone" ${PK.target.mode === 'amen' && !PK.folder ? 'disabled' : ''}>${PK.target.mode === 'amen' ? 'إضافة البند' : 'إضافة الصور'}${PK.sel.length ? ' (' + PK.sel.length + ')' : ''}</button></div></div>`;
  $('#upl').onchange = e => uploadFiles(e.target.files);
}
async function pickFolder(id) {
  PK.folder = id; renderPicker();
  if (!S.photos[id]) { try { S.photos[id] = await call('api_photos', id); } catch (e) { S.photos[id] = []; toast(e.message, true); } if (PK && PK.folder === id) renderPicker(); }
}
function resizeImg(file, max) {
  return new Promise((res, rej) => {
    const r = new FileReader(); r.onerror = rej;
    r.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.86)); }; im.src = r.result; };
    r.readAsDataURL(file);
  });
}
async function uploadFiles(files) {
  const P = CUR(); const list = [...files]; if (!list.length) return;
  busy('رفع الصور…');
  try {
    for (const f of list) {
      const d = await resizeImg(f, 1600);
      const r = await call('api_upload', S.user, P.Q, P.O, P.client, d, f.name);
      THUMB[r.id] = d; PK.sel.push({ id: r.id, name: r.name, code: 'UPL' });
    }
    busy(false); renderPicker(); toast('تم الرفع');
  } catch (e) { busy(false); toast(e.message || e, true); }
}
function pickDone() {
  const P = CUR(), t = PK.target; const f = PK.folder ? S.catalog.find(c => c.folderId === PK.folder) : null;
  const sel = PK.sel.map(p => ({ id: p.id, name: p.name || '', code: p.code || (f && f.code) || '' }));
  if (t.mode === 'amen') {
    if (FACT_PREFIX.test(f.code || '')) { P.decor.push(R.decor(f.name, f.code, { photos: sel, auto: false })); toast('كود ' + f.code + ' تبع المصنع — أُضيف في «الديكور والبوية»'); }
    else P.amen.push(R.amen(f.code, f.name, { nameEn: f.en || catEN(f.code), photos: sel, auto: false, area: '' }));
  } else if (t.L === 'sticker') {
    P.sticker.photos = dedupe(P.sticker.photos.concat(sel));
  } else {
    const r = P[t.L].find(x => x.id === t.id); if (r) { r.photos = dedupe((r.photos || []).concat(sel)); r.edited = true; }
  }
  closePicker(); markDirty(); rerenderStep();
}
const dedupe = a => a.filter((p, i) => a.findIndex(x => x.id === p.id) === i);
function closePicker() { const m = $('#modal'); if (m) m.remove(); PK = null; }

/* ═══════════════ حفظ / اعتماد ═══════════════ */
function ask(title, html, okText, okCls) {
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal'; m.id = 'askm';
    m.innerHTML = `<div class="sheet" style="max-width:520px"><div class="sheet-h"><b>${title}</b></div><div class="sheet-b">${html}</div>
      <div class="sheet-f"><span style="flex:1"></span><button class="btn" id="askNo">إلغاء</button><button class="btn ${okCls || 'pri'}" id="askOk">${okText || 'موافق'}</button></div></div>`;
    document.body.appendChild(m);
    const done = v => { const note = m.querySelector('#askNote'); const val = v ? (note ? note.value : true) : null; m.remove(); res(val); };
    m.querySelector('#askNo').onclick = () => done(false); m.querySelector('#askOk').onclick = () => done(true);
    const n = m.querySelector('#askNote'); if (n) n.focus();
  });
}
async function saveDraft(force) {
  if (!S.me.canEdit) return toast('ليس لديك صلاحية الحفظ — افتح رابطك الشخصي', true);
  const note = force ? S.cur.lastNote : await ask('حفظ نسخة جديدة', `<label class="f"><span>ملاحظة التعديل (اختياري)</span><input class="in" id="askNote" placeholder="مثال: تعديل ألوان الورد بطلب العميلة" value="${S.cur.viewing ? 'استرجاع محتوى النسخة ' + S.cur.viewing : ''}"></label>`, 'حفظ');
  if (note === null) return;
  S.cur.lastNote = note; busy('حفظ…');
  try {
    const r = await call('api_save', S.user, CUR(), note, S.cur.base, !!force);
    busy(false);
    if (r.conflict) return conflict(r, () => saveDraft(true));
    afterSave(r, 'مسودة', note); toast('تم الحفظ — النسخة ' + r.version);
  } catch (e) { busy(false); toast(e.message || e, true); }
}
async function conflict(r, again) {
  const ok = await ask('يوجد نسخة أحدث', `<p class="sub">حُفظت النسخة <b>v${r.latest}</b> بواسطة <b>${esc(r.by)}</b> (${esc(r.date)}) بعد ما فتحت الخطة.</p><p class="sub">«حفظ كنسخة جديدة» يحفظ تعديلاتك فوقها (تبقى نسخته محفوظة في السجل).</p>`, 'حفظ كنسخة جديدة', 'gold');
  if (ok) again();
}
function afterSave(r, type, note) {
  const P = CUR(); S.cur.base = r.version; S.cur.dirty = false; S.cur.viewing = 0; S.cur.backup = null; P.version = r.version;
  S.cur.meta = Object.assign({}, S.cur.meta || {}, { status: r.status, version: r.version }, r.pdfs ? { pdfs: r.pdfs, approvedVersion: r.version, approvedBy: S.user } : {});
  S.cur.versions.push({ v: r.version, date: new Date().toLocaleString('en-GB'), by: S.user, type, note, pdfs: r.pdfs || {} });
  S.plans[P.Q] = Object.assign({}, S.plans[P.Q] || {}, { status: r.status, version: r.version });
  if (r.pdfs && S.alerts) delete S.alerts[P.Q];
  lsSet('plan-' + P.Q, null); renderEditor();
}
async function approve(force) {
  const P = CUR(); const w = validate(P);
  const note = force ? S.cur.lastNote : await ask('اعتماد الخطة وإصدار PDF', `${w.length ? `<div class="warn">• ${w.map(esc).join('<br>• ')}</div>` : '<div class="ok">✓ لا توجد ملاحظات</div>'}
    <p class="sub">سيتم حفظ نسخة «اعتماد» وإصدار ملفات PDF في الدرايف: الخطط الخمس (الكاملة، المصنع، الكماليات EN، الضيافة، المشتريات) + قائمة تحقق لكل خطة.</p>
    <label class="f"><span>ملاحظة الاعتماد (اختياري)</span><input class="in" id="askNote"></label>`, 'اعتماد وإصدار', 'gold');
  if (note === null) return;
  S.cur.lastNote = note;
  P.approvedBy = S.user;
  const D = buildDocs(P, 'pdf'); const docs = {}; Object.keys(D).forEach(k => { docs[k] = { title: D[k].title, html: D[k].html }; });
  busy('إصدار ملفات PDF… قد يستغرق دقيقة');
  try {
    const r = await call('api_approve', S.user, P, note, docs, S.cur.base, !!force);
    busy(false);
    if (r.conflict) return conflict(r, () => approve(true));
    afterSave(r, 'اعتماد', note); toast('تم الاعتماد — النسخة ' + r.version);
  } catch (e) { busy(false); P.approvedBy = ''; toast(e.message || e, true); }
}
function printDoc() {
  const d = buildDocs(CUR(), 'preview')[S.cur.doc || 'full'];
  const w = window.open('', '_blank'); if (!w) return toast('اسمح بالنوافذ المنبثقة للطباعة', true);
  w.document.open(); w.document.write(d.html.replace('</body>', '<script>window.onload=()=>setTimeout(()=>print(),700)<\/script></body>')); w.document.close();
}
async function viewVersion(v) {
  if (S.cur.dirty && !(await ask('تعديلات غير محفوظة', '<p class="sub">عندك تعديلات غير محفوظة ستضيع. متابعة؟</p>', 'متابعة', 'red'))) return;
  busy('تحميل النسخة…');
  try {
    const p = await call('api_getVersion', S.cur.c.Q, v); busy(false);
    S.cur.plan = migrate(p); S.cur.viewing = v === S.cur.base ? 0 : v; S.cur.dirty = false; S.step = 0; renderEditor(); window.scrollTo(0, 0);
  } catch (e) { busy(false); toast(e.message || e, true); }
}

/* ═══════════════ الأحداث ═══════════════ */
function setVal(b, v) {
  const P = CUR(); const [Lk, a, f] = b.split('|');
  if (Lk === '@') { P[a] = v; if (a === 'days') { P.days = +v || 1; P.hosp.filter(isStaff).forEach(r => { r.perDay = null; syncPer(r, P); }); } }
  else if (Lk === 'baby' || Lk === 'sticker' || Lk === 'theme') P[Lk][a] = v;
  else { const r = (P[Lk] || []).find(x => x.id === a); if (!r) return; 
    if (Lk === 'amen' && f === 'code') { const c = (S.catalog || []).find(x => x.code === v); if (c) { if (!r.nameEn || r.nameEn === catEN(r.code)) r.nameEn = c.en || ''; if (!r.nameAr) r.nameAr = c.name; } }
    r[f] = v; r.edited = true; }
  markDirty();
}
function getArr(b) { const P = CUR(); const [Lk, a, f] = b.split('|'); if (Lk === 'theme') return P.theme[a]; const r = P[Lk].find(x => x.id === a); return r ? (r[f] = r[f] || []) : []; }
document.addEventListener('input', e => {
  const t = e.target; if (!S.cur || !t.dataset) return;
  if (t.dataset.b && t.type !== 'checkbox' && t.tagName !== 'SELECT') setVal(t.dataset.b, t.value);
  else if (t.dataset.pd) { const [id, di] = t.dataset.pd.split('|'); const P = CUR(); const r = P.hosp.find(x => x.id === id); if (r) { syncPer(r, P); r.perDay[+di] = num(t.value); r.qty = r.perDay.reduce((a, b) => a + b, 0); r.edited = true; markDirty(); } }
  else if (t.dataset.sum) { const [i, f] = t.dataset.sum.split('|'); const P = CUR(); if (P.hospSum && P.hospSum[+i]) { P.hospSum[+i][f] = t.value; markDirty(); } }
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset) return;
  if (t.dataset.b && (t.type === 'checkbox' || t.tagName === 'SELECT')) { setVal(t.dataset.b, t.type === 'checkbox' ? t.checked : t.value); rerenderStep(); }
  else if (t.dataset.cat) { const l = CUR().contract.find(x => x.id === t.dataset.cat); if (l) { l.cat = t.value; l.manualCat = true; markDirty(); toast('اضغط «إعادة التوليد من العقد» لتطبيق التصنيف'); } }
  else if (t.dataset.skip) { const P = CUR(); P.buySkip = P.buySkip || {}; if (t.checked) delete P.buySkip[t.dataset.skip]; else P.buySkip[t.dataset.skip] = 1; markDirty(); rerenderStep(); }
  else if (t.dataset.chipadd) { addChip(t); }
  else if (t.dataset.pd) { rerenderStep(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.chipadd) { e.preventDefault(); addChip(e.target); } });
function addChip(t) { const v = t.value.trim(); if (!v) return; const a = getArr(t.dataset.chipadd); if (a.indexOf(v) < 0) a.push(v); t.value = ''; markDirty(); rerenderStep(); }

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-open],[data-filter],[data-step],[data-act],[data-chip],[data-seg],[data-add],[data-del],[data-addph],[data-rmph],[data-folder],[data-pick],[data-zoom],[data-doc],[data-ver]');
  if (!el) return; const d = el.dataset;
  if (d.zoom) { e.stopPropagation(); return zoom(d.zoom); }
  if (d.open) return openContract(d.open);
  if (d.filter) { S.filter = d.filter; return renderList(); }
  if (d.step != null) { S.step = +d.step; renderEditor(); window.scrollTo(0, 0); return; }
  if (d.chip) { const a = getArr(d.chip); const i = a.indexOf(d.v); if (i >= 0) a.splice(i, 1); else a.push(d.v); const [Lk, id] = d.chip.split('|'); const r = (CUR()[Lk] || []).find && (CUR()[Lk] || []).find(x => x.id === id); if (r) r.edited = true; markDirty(); return rerenderStep(); }
  if (d.seg) { setVal(d.seg, d.v); return rerenderStep(); }
  if (d.add) {
    const P = CUR(); const [Lk, k] = d.add.split('|');
    const row = Lk === 'hosp' ? R.hosp(k, '', { auto: false }) : Lk === 'natural' ? R.flower('', { auto: false }) : Lk === 'artificial' ? R.flower('', { auto: false, buy: false })
      : Lk === 'amen' ? R.amen('', '', { auto: false }) : Lk === 'decor' ? R.decor('', '', { auto: false }) : Lk === 'fabrics' ? R.fabric()
      : { id: uid(), item: '', qty: '', unit: '', supplier: '', sec: '', desc: '' };
    if (Lk === 'hosp' && k === 'staff') { row.perDay = Array(nDays(P)).fill(0); row.qty = 0; }
    (P[Lk] = P[Lk] || []).push(row); markDirty(); rerenderStep();
    setTimeout(() => { const x = document.querySelector(`[data-b^="${Lk}|${row.id}|"]`); if (x) { x.scrollIntoView({ block: 'center' }); x.focus(); } }, 30);
    return;
  }
  if (d.del) { const [Lk, id] = d.del.split('|'); if (!(await ask('حذف البند', '<p class="sub">متأكد من حذف هذا البند من الخطة؟</p>', 'حذف', 'red'))) return; const P = CUR(); P[Lk] = P[Lk].filter(x => x.id !== id); markDirty(); return rerenderStep(); }
  if (d.addph) { const [Lk, id, code] = d.addph.split('|'); return openPicker({ L: Lk, id, code }); }
  if (d.rmph) { const [Lk, id, i] = d.rmph.split('|'); const P = CUR(); const arr = Lk === 'sticker' ? P.sticker.photos : (P[Lk].find(x => x.id === id) || {}).photos; if (arr) arr.splice(+i, 1); markDirty(); return rerenderStep(); }
  if (d.folder) return pickFolder(d.folder);
  if (d.pick) { const i = PK.sel.findIndex(x => x.id === d.pick); if (i >= 0) PK.sel.splice(i, 1); else PK.sel.push({ id: d.pick }); el.classList.toggle('on'); const b = document.querySelector('[data-act="pickDone"]'); if (b) b.textContent = (PK.target.mode === 'amen' ? 'إضافة البند' : 'إضافة الصور') + (PK.sel.length ? ` (${PK.sel.length})` : ''); return; }
  if (d.doc) { S.cur.doc = d.doc; document.querySelectorAll('[data-doc]').forEach(x => x.classList.toggle('on', x.dataset.doc === d.doc)); return showDoc(); }
  if (d.ver) return viewVersion(+d.ver);
  const [act, arg] = (d.act || '').split('|');
  switch (act) {
    case 'back':
      if (S.cur && S.cur.dirty && !(await ask('تعديلات غير محفوظة', '<p class="sub">عندك تعديلات لم تُحفظ كنسخة (محفوظة مؤقتاً على هذا الجهاز). الخروج؟</p>', 'خروج'))) return;
      S.view = 'list'; S.cur = null; renderList(); window.scrollTo(0, 0); call('api_contracts').then(r => { S.contracts = r.contracts; S.plans = r.plans; S.alerts = r.alerts || {}; if (S.view === 'list') renderList(); }).catch(() => { }); return;
    case 'prev': if (S.step > 0) { S.step--; renderEditor(); window.scrollTo(0, 0); } return;
    case 'next': if (S.step < STEPS.length - 1) { S.step++; renderEditor(); window.scrollTo(0, 0); } return;
    case 'save': return saveDraft();
    case 'approve': return approve();
    case 'print': return printDoc();
    case 'regen': case 'resync': {
      if (!(await ask('إعادة التوليد من العقد', '<p class="sub">سيُعاد إنشاء البنود الآلية (الذهبية) من العقد. البنود اليدوية والتي عدّلتها تبقى كما هي.</p>', 'إعادة التوليد'))) return;
      buildFromContract(CUR(), S.cur.c, true); markDirty(); renderEditor(); return toast('تم التحديث من العقد');
    }
    case 'restoreBk': S.cur.plan = S.cur.backup.plan; S.cur.backup = null; S.cur.dirty = true; renderEditor(); return toast('تم الاسترجاع — احفظ لتثبيته');
    case 'dropBk': S.cur.backup = null; lsSet('plan-' + CUR().Q, null); return renderEditor();
    case 'latest': return viewVersion(S.cur.versions.length ? S.cur.versions[S.cur.versions.length - 1].v : 0);
    case 'pickAmen': return openPicker({ mode: 'amen' });
    case 'pickDone': return pickDone();
    case 'closePicker': return closePicker();
    case 'refreshCat': busy('تحديث الكتالوج…'); try { S.catalog = await call('api_catalog', true); if (PK) { delete S.photos[PK.folder]; pickFolder(PK.folder); } } catch (er) { toast(er.message, true); } busy(false); return;
    case 'sumEdit': { const P = CUR(); P.hospSum = autoSummary(P); markDirty(); return rerenderStep(); }
    case 'sumAuto': { const P = CUR(); P.hospSum = null; markDirty(); return rerenderStep(); }
    case 'sumAdd': { const P = CUR(); (P.hospSum = P.hospSum || autoSummary(P)).push({ label: '', val: '', note: '' }); markDirty(); return rerenderStep(); }
    case 'sumDel': { const P = CUR(); if (P.hospSum) P.hospSum.splice(+arg, 1); markDirty(); return rerenderStep(); }
    case 'toFactory': {
      const P = CUR(); const [, Lk, id] = d.act.split('|'); const r = (P[Lk] || []).find(x => x.id === id); if (!r) return;
      if (!(await ask('نقل إلى المصنع', `<p class="sub">ينقل «${esc(r.nameAr || r.item || '')}» من ${Lk === 'amen' ? 'الكماليات' : 'الضيافة'} إلى «الديكور والبوية» (خطة المصنع) ويحذفه من مكانه الحالي.<br>لو القطعة تطلع من المستودع وتُصبغ فقط، استخدم خيار «يُصبغ في المصنع» بدل النقل.</p>`, 'نقل'))) return;
      P.decor.push(R.decor(r.nameAr || r.item || '', FACT_PREFIX.test(r.code || '') ? r.code : '', { area: r.area || '', qty: r.qty || 1, desc: r.desc || '', photos: r.photos || [], paints: r.paints || [], finish: r.finish || [], auto: false, edited: true, src: r.src || [] }));
      P[Lk] = P[Lk].filter(x => x.id !== id); markDirty(); rerenderStep(); return toast('نُقل إلى بنود المصنع');
    }
    case 'copyFlowers': { const P = CUR(); const a = P[arg]; if (!a.length) return; a.slice(1).forEach(r => { if (!r.types.length) r.types = a[0].types.slice(); if (!r.colors.length) r.colors = a[0].colors.slice(); r.edited = true; }); markDirty(); return rerenderStep(); }
  }
});
window.addEventListener('beforeunload', e => { if (S.cur && S.cur.dirty) { e.preventDefault(); e.returnValue = ''; } });

document.getElementById('logo').src = LOGO_URI;
boot();
</script>
