<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>الجرد — منصّة أبيلا</title>
<style>
:root{--g:#8B6F47;--ln:#E8DFD0;--bg:#FAF7F2;--ok:#2E7D4F;--bad:#B3261E;--warn:#B7791F}
*{box-sizing:border-box}body{margin:0;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;background:var(--bg);color:#2B2420;font-size:14px}
#hubbar{background:#FFF6E5;border-bottom:1px solid var(--ln);padding:7px 14px;font-size:13px}#hubbar a{color:var(--g);font-weight:700;text-decoration:none}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--ln)}header h1{font-size:18px;margin:0;color:var(--g)}
nav{display:flex;gap:4px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--ln);overflow-x:auto}
nav button,.seg button{border:0;background:none;padding:8px 14px;border-radius:8px;font:inherit;color:#6B5B4B;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--g);color:#fff}
main{padding:14px;max-width:1100px;margin:auto}
.card{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.seg button{border:1px solid var(--ln);background:#fff;flex:1;min-width:100px;padding:12px}
.seg button.on{border-color:var(--g);background:#FFF6E5;color:var(--g);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
label{display:block;font-size:12px;color:#7A6A58;margin-bottom:3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--ln);border-radius:8px;font:inherit;background:#fff}
.btn{border:0;background:var(--g);color:#fff;padding:10px 16px;border-radius:8px;font:inherit;cursor:pointer}.btn.sec{background:#F1EADF;color:var(--g)}.btn.bad{background:var(--bad)}.btn.sm{padding:5px 10px;font-size:12px}
.states{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.states div{background:#FBF8F3;border-radius:8px;padding:8px}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.ph img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--ln)}
.ph .x{position:relative}.ph .x span{position:absolute;bottom:2px;inset-inline-start:2px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;border-radius:4px;padding:0 4px}
.item{display:flex;gap:12px;border-bottom:1px solid #F0E9DD;padding:10px 0}.item img{width:72px;height:72px;object-fit:cover;border-radius:10px;flex:none;background:#eee}
.muted{color:#9A8B7A;font-size:12px}.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:#F1EADF;color:var(--g)}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.kpi div{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px}.kpi b{display:block;font-size:22px;color:var(--g)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px;border-bottom:1px solid #F0E9DD;text-align:right}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2B2420;color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:9}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:10}.lb img{max-width:94vw;max-height:90vh}
</style>
<link rel="stylesheet" href="/assets/fonts.css">
<script src="/assets/icons.js" defer></script>
</head>
<body>
<div id="hubbar"><a href="/dashboard/">← منصّة أبيلا</a> · الجرد — المصنع والمستودع الثاني</div>
<header><h1>الجرد</h1><span style="flex:1"></span><span id="who" class="muted"></span></header>
<nav id="tabs"></nav>
<main id="main"><div class="card">جارٍ التحميل…</div></main>
<div class="toast" id="toast"></div>
<script src="/assets/session.js"></script>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=(m,ms=2600)=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms)};
async function api(p,b){const r=await fetch(p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});
  if(r.status===401){location.href='/dashboard/';throw new Error('سجّل الدخول')}const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||'خطأ');return j}
const S={tab:'add',sec:'asset',wh:'factory',B:null,edit:null,photos:[],list:[]};
const SEC={raw:'الخام',eqp:'المعدات',asset:'الأصول'};
function shrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
async function boot(){
  try{S.B=await api('/api/jard/boot')}catch(e){$('#main').innerHTML=`<div class="card">${esc(e.message)}</div>`;return}
  $('#who').textContent=S.B.me;
  const tabs=[];if(S.B.canWrite)tabs.push(['add','إدخال']);tabs.push(['list','كل الجرد']);if(S.B.isSuper)tabs.push(['dash','اللوحة']);
  if(!S.B.canWrite)S.tab='list';
  $('#tabs').innerHTML=tabs.map(([k,l])=>`<button data-t="${k}">${l}</button>`).join('');
  $('#tabs').onclick=e=>{const t=e.target.dataset.t;if(t){S.tab=t;if(t==='add'){S.edit=null;S.photos=[]}render()}};render()}
function render(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));({add:renderAdd,list:renderList,dash:renderDash})[S.tab]()}
function catOpts(sel){const cs=S.B.cats.filter(c=>c.wh===S.wh);const g={};cs.forEach(c=>(g[c.sub]=g[c.sub]||[]).push(c));
  return '<option value="">— اختر —</option>'+Object.entries(g).map(([s,a])=>`<optgroup label="${esc(s)}${a[0].sub_en?' / '+esc(a[0].sub_en):''}">${a.map(c=>`<option value="${c.code}" ${c.code===sel?'selected':''}>${esc(c.type)}${c.type_en?' / '+esc(c.type_en):''} (${c.code})</option>`).join('')}</optgroup>`).join('')}
function renderAdd(){
  const e=S.edit||{},sec=e.section||S.sec,B=S.B;if(e.wh)S.wh=e.wh;
  const dl=(id,a)=>`<datalist id="${id}">${(a||[]).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
  const w2=S.wh==='w2';
  let f='';
  if(sec==='raw')f=`<div><label>الصنف *</label><input id="f_name" list="dln" value="${esc(e.name||'')}">${dl('dln',B.names.raw)}</div>
    <div><label>الكمية *</label><input id="f_qty" type="number" step="0.01" inputmode="decimal" value="${e.qty||''}"></div>
    <div><label>الوحدة</label><select id="f_unit">${B.units.map(u=>`<option ${u===e.unit?'selected':''}>${u}</option>`).join('')}</select></div>`;
  if(sec==='eqp')f=`<div><label>اسم المعدة *</label><input id="f_name" list="dln" value="${esc(e.name||'')}">${dl('dln',B.names.eqp)}</div>
    <div><label>الرقم التسلسلي</label><input id="f_serial" value="${esc(e.serial||'')}"></div>
    <div><label>الكمية *</label><input id="f_qty" type="number" step="1" value="${e.qty||1}"></div>
    <div><label>الحالة</label><select id="f_state">${B.eqpStates.map(s=>`<option ${s===e.state?'selected':''}>${s}</option>`).join('')}</select></div>`;
  if(sec==='asset')f=`<div style="grid-column:1/-1"><label>نوع الصنف *</label><select id="f_code">${catOpts(e.code)}</select></div>
    <div><label>اسم القطعة *</label><input id="f_name" list="dln" value="${esc(e.name||'')}">${dl('dln',B.names.asset)}</div>
    ${w2?`<div><label>Item name (EN)</label><input id="f_name_en" dir="ltr" value="${esc(e.name_en||'')}"></div>`:''}
    <div><label>الكمية *</label><input id="f_qty" type="number" step="1" value="${e.qty||''}" oninput="autoCounts()"></div>
    <div style="grid-column:1/-1"><label>توزيع الحالات (المجموع = الكمية)</label><div class="states">${B.states.map(s=>`<div><label>${s}${w2?' / '+B.statesEn[s]:''}</label><input type="number" min="0" class="cnt" data-s="${s}" value="${(e.counts||{})[s]??0}" oninput="calcCnt()"></div>`).join('')}</div><div id="cntmsg" class="muted"></div></div>`;
  const shots=sec==='asset'?['ممتاز','جيد','يحتاج صيانة','تالف','إضافية']:['صورة'];
  $('#main').innerHTML=`${e.id?'':`<div class="seg">${Object.entries(SEC).map(([k,l])=>`<button data-s="${k}" class="${k===sec?'on':''}">${l}</button>`).join('')}</div>`}
  ${sec==='asset'&&!e.id?`<div class="seg">${Object.entries(B.wh).map(([k,l])=>`<button data-w="${k}" class="${k===S.wh?'on':''}">${l}</button>`).join('')}</div>`:''}
  <div class="card">${e.id?`<div class="row" style="margin-bottom:8px"><b>تعديل: ${esc(e.name)}</b> <button class="btn sec sm" onclick="S.edit=null;S.photos=[];renderAdd()">إلغاء</button></div>`:''}
  <div class="grid">${f}
   <div><label>موقع التخزين</label><input id="f_location" list="dll" value="${esc(e.location||'')}">${dl('dll',B.locations)}</div>
   <div style="grid-column:1/-1"><label>الوصف * <span class="muted">(شكل القطعة، لونها، مقاسها — عشان تنعرف من بين غيرها)</span></label><textarea id="f_description">${esc(e.description||'')}</textarea></div>
   <div style="grid-column:1/-1"><label>ملاحظات</label><input id="f_notes" value="${esc(e.notes||'')}"></div>
   <div style="grid-column:1/-1"><label>الصور ${sec==='asset'?'(صورة لكل حالة فيها قطع + حتى 3 إضافية)':'(1 إلى 4 — إلزامية)'}</label>
    <div class="row" style="display:flex;gap:6px;flex-wrap:wrap">${shots.map(s=>`<label class="btn sec sm" style="margin:0">📷 ${s}<input type="file" accept="image/*" capture="environment" data-ps="${s}" style="display:none" onchange="addPh(this)"></label>`).join('')}</div>
    <div class="ph" id="phs"></div></div>
  </div><div style="margin-top:12px"><button class="btn" onclick="save(this)">حفظ</button></div></div>`;
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.sec=b.dataset.s;S.photos=[];renderAdd()});
  document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{S.wh=b.dataset.w;renderAdd()});
  drawPh();if(sec==='asset')calcCnt();
}
function autoCounts(){const q=+$('#f_qty').value||0,c=document.querySelectorAll('.cnt');if([...c].slice(1).every(i=>!+i.value)){c[0].value=q}calcCnt()}
function calcCnt(){const q=+($('#f_qty')||{}).value||0,s=[...document.querySelectorAll('.cnt')].reduce((a,i)=>a+(+i.value||0),0);const m=$('#cntmsg');if(m)m.innerHTML=s===q?'✓ المجموع مطابق':`<span style="color:var(--bad)">المجموع ${s} ≠ الكمية ${q}</span>`}
async function addPh(inp){const f=inp.files[0];if(!f)return;try{const d=await shrink(f);S.photos.push({state:inp.dataset.ps==='صورة'?'':inp.dataset.ps,data:d});drawPh()}catch(e){toast('تعذّرت قراءة الصورة')}inp.value=''}
function drawPh(){const old=(S.edit&&S.edit.photos)||[];$('#phs').innerHTML=old.map(p=>`<div class="x"><img src="${esc(p.url)}" onclick="lb('${esc(p.url)}')"><span>${esc(p.state||'')} <a style="color:#fff" onclick="delPh('${p.id}')">✕</a></span></div>`).join('')+S.photos.map((p,i)=>`<div class="x"><img src="${p.data}"><span>${esc(p.state||'جديدة')} <a style="color:#fff" onclick="S.photos.splice(${i},1);drawPh()">✕</a></span></div>`).join('')}
async function delPh(id){if(!confirm('حذف الصورة؟'))return;await api('/api/jard/photo-delete',{id});S.edit.photos=S.edit.photos.filter(p=>p.id!==id);drawPh()}
async function save(btn){const v=id=>($('#f_'+id)||{}).value||'';const e=S.edit||{};const sec=e.section||S.sec;
  const counts={};document.querySelectorAll('.cnt').forEach(i=>counts[i.dataset.s]=+i.value||0);
  btn.disabled=true;try{await api('/api/jard/save',{id:e.id||'',section:sec,wh:sec==='asset'?S.wh:'factory',code:v('code'),name:v('name'),name_en:v('name_en'),qty:v('qty'),unit:v('unit'),serial:v('serial'),state:v('state'),counts,location:v('location'),description:v('description'),notes:v('notes'),photos:S.photos});
    toast(e.id?'حُفظ التعديل ✓':'حُفظ ✓ — جاهز للإدخال التالي');S.photos=[];if(e.id){S.edit=null;S.tab='list';render()}else{S.B=await api('/api/jard/boot');renderAdd()}}
  catch(err){toast(err.message,4000);btn.disabled=false}}
function lb(u){const d=document.createElement('div');d.className='lb';d.innerHTML=`<img src="${u}">`;d.onclick=()=>d.remove();document.body.appendChild(d)}
async function renderList(){
  $('#main').innerHTML=`<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap">
   <select id="ls" style="width:auto"><option value="">كل الخانات</option>${Object.entries(SEC).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select>
   <select id="lw" style="width:auto"><option value="">كل المستودعات</option>${Object.entries(S.B.wh).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select>
   <input id="lq" placeholder="بحث بالاسم أو الوصف أو الرمز" style="flex:1;min-width:160px"><button class="btn sm" onclick="loadList()">عرض</button></div>
   <div id="lsum" class="muted" style="margin-top:8px"></div><div id="ll"></div></div>`;
  $('#lq').onkeydown=e=>e.key==='Enter'&&loadList();loadList()}
async function loadList(){const qs=new URLSearchParams({section:$('#ls').value,wh:$('#lw').value,q:$('#lq').value});
  const rows=S.list=await api('/api/jard/list?'+qs).catch(e=>(toast(e.message),[]));
  $('#lsum').textContent=`${rows.length} إدخال · ${rows.reduce((a,r)=>a+(+r.qty||0),0).toLocaleString('en')} قطعة/وحدة`;
  $('#ll').innerHTML=rows.map(r=>{const st=r.section==='asset'?Object.entries(r.counts).filter(([,n])=>n).map(([s,n])=>`${s} ${n}`).join(' · '):(r.section==='eqp'?r.state:r.unit);
    const im=(r.photos[0]||{}).url;
    return `<div class="item">${im?`<img src="${esc(im)}" onclick="lb('${esc(im)}')">`:'<img>'}<div style="flex:1"><b>${esc(r.name)}</b>${r.name_en?` <span class="muted" dir="ltr">${esc(r.name_en)}</span>`:''} <span class="badge">${SEC[r.section]}${r.code?' · '+esc(r.code):''}</span>
     <div>${esc(r.description||'')}</div><div class="muted">الكمية ${r.qty}${st?' · '+esc(st):''}${r.location?' · '+esc(r.location):''} · ${esc(r.by_name||'')} · ${esc((r.at||'').slice(0,16))}${r.source&&r.source!=='hub'?' · '+esc(r.source):''}</div>
     <div class="ph">${r.photos.slice(1,6).map(p=>`<img src="${esc(p.url)}" style="width:44px;height:44px" onclick="lb('${esc(p.url)}')">`).join('')}</div></div>
     <div>${S.B.canWrite?`<button class="btn sec sm" onclick="editIt('${r.id}')">تعديل</button>`:''}${S.B.isSuper?` <button class="btn bad sm" onclick="delIt('${r.id}')">حذف</button>`:''}</div></div>`}).join('')||'<div class="muted">لا يوجد</div>'}
function editIt(id){S.edit=S.list.find(r=>r.id===id);S.photos=[];S.tab='add';render()}
async function delIt(id){if(!confirm('حذف هذا الإدخال؟'))return;await api('/api/jard/delete',{id});toast('حُذف');loadList()}
async function renderDash(){const d=await api('/api/jard/stats').catch(e=>(toast(e.message),null));if(!d)return;
  const f=d.wh.factory,w=d.wh.w2;
  $('#main').innerHTML=`<div class="kpi"><div>قطع الأصول — المصنع<b>${f.pieces}</b><span class="muted">${f.entries} إدخال</span></div><div>المستودع الثاني<b>${w.pieces}</b><span class="muted">${w.entries} إدخال</span></div>
   <div>أصناف الخام<b>${d.raw}</b></div><div>قطع المعدات<b>${d.eqp}</b></div>
   <div>تحتاج صيانة<b style="color:var(--warn)">${f.states['يحتاج صيانة']+w.states['يحتاج صيانة']}</b></div><div>تالفة<b style="color:var(--bad)">${f.states['تالف']+w.states['تالف']}</b></div></div>
   <div class="card" style="margin-top:12px"><b>حسب النوع</b><table><tr><th>الرمز</th><th>الفرعي</th><th>النوع</th><th>إدخالات</th><th>القطع</th></tr>${d.byType.map(r=>`<tr><td>${esc(r.code)}</td><td>${esc(r.sub)}</td><td>${esc(r.type)}</td><td>${r.n}</td><td><b>${r.qty}</b></td></tr>`).join('')}</table></div>
   ${d.eqpIssues.length?`<div class="card"><b>معدات تحتاج صيانة/تالفة</b><table>${d.eqpIssues.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.serial)}</td><td>${esc(r.state)}</td><td>${r.qty}</td><td>${esc(r.location)}</td></tr>`).join('')}</table></div>`:''}
   <div class="card"><b>أداء الفريق</b><table>${d.team.map(r=>`<tr><td>${esc(r.by_name)}</td><td>${r.n} إدخال</td><td class="muted">آخر إدخال ${esc(r.last||'')}</td></tr>`).join('')}</table></div>`}
boot();
</script>
</body>
</html>
