<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رأيك يهمنا — أبيلا للأفراح والمناسبات</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{--g:#8B6F47;--g2:#C9AE84;--ln:#E8DFD0;--bg:#FAF7F2}
*{box-sizing:border-box}body{margin:0;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;background:var(--bg);color:#2B2420;font-size:15px}
.wrap{max-width:640px;margin:auto;padding:22px 16px 40px}
.logo{text-align:center;color:var(--g);margin-bottom:6px}.logo b{font-size:26px;letter-spacing:.5px;display:block}.logo small{color:#9A8B7A}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:15px;color:var(--g);margin:0 0 10px}
.scale{display:flex;gap:6px;flex-wrap:wrap}.scale button{flex:1;min-width:38px;border:1px solid var(--ln);background:#fff;border-radius:10px;padding:10px 0;font:inherit;cursor:pointer}
.scale button.on{background:var(--g);color:#fff;border-color:var(--g)}
.opt{display:block;border:1px solid var(--ln);border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer}.opt.on{background:#F6EFE3;border-color:var(--g2)}
.opt input{margin-inline-end:6px;width:auto}
textarea,input{font:inherit;width:100%;border:1px solid var(--ln);border-radius:10px;padding:9px;background:#fff}textarea{min-height:70px}
.hint{color:#9A8B7A;font-size:12px;display:flex;justify-content:space-between;margin-top:4px}
button.send{width:100%;background:var(--g);color:#fff;border:0;border-radius:12px;padding:13px;font:inherit;font-size:16px;cursor:pointer}
.foot{text-align:center;color:#9A8B7A;font-size:11px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
 <div class="logo"><b>Abella</b><small>أبيلا للأفراح والمناسبات</small></div>
 <div id="app"><div class="card">جارٍ التحميل…</div></div>
 <div class="foot">© أبيلا للأفراح والمناسبات — الرياض</div>
</div>
<script>
const tok=location.pathname.split('/').pop(),A={},$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function scale(k,from,to,lo,hi){let h='';for(let i=from;i<=to;i++)h+=`<button type="button" data-k="${k}" data-v="${i}" onclick="pick(this)">${i}</button>`;return `<div class="scale">${h}</div><div class="hint"><span>${lo}</span><span>${hi}</span></div>`}
function pick(b){A[b.dataset.k]=+b.dataset.v;document.querySelectorAll(`[data-k="${b.dataset.k}"]`).forEach(x=>x.classList.toggle('on',x===b))}
function opts(k,list){return list.map(o=>`<label class="opt"><input type="radio" name="${k}" value="${esc(o)}" onchange="A['${k}']=this.value;document.querySelectorAll('input[name=${k}]').forEach(x=>x.parentNode.classList.toggle('on',x.checked))">${esc(o)}</label>`).join('')}
async function boot(){const r=await fetch('/api/public/survey/'+tok);const d=await r.json();
 if(d.error){$('#app').innerHTML=`<div class="card">${esc(d.error)}</div>`;return}
 if(d.answered){$('#app').innerHTML='<div class="card" style="text-align:center">وصلنا ردك — شكراً لك 🤍</div>';return}const q=d.q;
 $('#app').innerHTML=`<div class="card" style="text-align:center"><b>${esc(d.title||'مناسبتك')}</b><div style="color:#9A8B7A;font-size:13px">${esc(d.date||'')}</div><div style="margin-top:8px">شكراً لثقتك بأبيلا. دقيقتين من وقتك تساعدنا نكون أفضل.</div></div>
 <div class="card"><h2>ما مدى رضاك العام عن تجربتك مع أبيلا؟</h2>${scale('csat',1,5,'غير راضية تماماً','راضية تماماً')}</div>
 <div class="card"><h2>ما احتمالية أن توصي بأبيلا لصديقة أو قريبة؟</h2>${scale('nps',0,10,'لن أوصي إطلاقاً','سأوصي بشدة')}</div>
 <div class="card"><h2>هل كانت المناسبة كما تخيلتيها؟</h2>${opts('expect',q.expect)}</div>
 <div class="card"><h2>التواصل قبل المناسبة</h2>${scale('comm',1,5,'ضعيف','ممتاز')}<h2 style="margin-top:14px">التنفيذ يوم المناسبة</h2>${scale('exec',1,5,'ضعيف','ممتاز')}<h2 style="margin-top:14px">الالتزام بالمواعيد</h2>${scale('time',1,5,'ضعيف','ممتاز')}</div>
 <div class="card"><h2>أكثر تفصيلة أعجبتك؟</h2><textarea id="best"></textarea><h2 style="margin-top:12px">هل لاحظت لمسة لم تكن متوقعة؟</h2><textarea id="surprise"></textarea><h2 style="margin-top:12px">ما الذي كان يمكن أن يكون أفضل؟</h2><textarea id="better"></textarea></div>
 <div class="card"><h2>ما رد فعل ضيوفك؟</h2>${opts('guests',q.guests)}</div>
 <div class="card"><h2>هل تخططين لمناسبة أخرى مع أبيلا؟</h2>${opts('again',q.again)}</div>
 <div class="card"><h2>هل توافقين على استخدام صور مناسبتك للتسويق؟</h2>${opts('photos',q.photos)}</div>
 <div class="card"><h2>صديقة قد تستفيد من خدماتنا؟ (اختياري)</h2><div style="color:#9A8B7A;font-size:13px;margin-bottom:8px">نتواصل معها بطريقة لائقة، وتحصلين على خصم خاص لمناسبتك القادمة.</div><input id="ref_name" placeholder="اسمها"><div style="height:6px"></div><input id="ref_phone" placeholder="رقم تواصلها" inputmode="tel"></div>
 <div class="card"><h2>كلمتك لنا</h2><textarea id="comment"></textarea></div>
 <button class="send" onclick="send(this)">إرسال</button>`}
async function send(b){['best','surprise','better','ref_name','ref_phone','comment'].forEach(k=>A[k]=$('#'+k).value.trim());
 if(A.csat==null||A.nps==null){alert('فضلاً اختاري تقييم الرضا والتوصية');return}b.disabled=true;
 const r=await fetch('/api/public/survey/'+tok,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(A)});const d=await r.json();
 if(d.ok){$('#app').innerHTML='<div class="card" style="text-align:center;padding:30px"><b style="color:var(--g);font-size:18px">شكراً لك 🤍</b><div style="margin-top:8px">وصلنا رأيك، وسعدنا بخدمتك.</div></div>';window.scrollTo(0,0)}else{alert(d.error||'تعذّر الإرسال');b.disabled=false}}
boot();
</script>
</body>
</html>
