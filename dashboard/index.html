<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصّة أبيلا — لوحة التحكم</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/dashboard/modules.js" defer></script>
<style>
:root {
  /* هوية أبيلا الراقية - بيج وذهبي وبُني دافئ */
  --primary: #8B6F47;          /* بُني كاراميل دافئ */
  --primary-light: #B8975D;    /* ذهبي متوسط */
  --primary-dark: #5C4528;     /* إسبريسو عميق */
  --accent: #C9A560;           /* ذهبي عتيق */
  --accent-2: #D4B97A;         /* ذهبي فاتح */
  --success: #7A8A5F;          /* أخضر سيج هادئ */
  --warning: #D4A04C;          /* عنبري دافئ */
  --danger: #A04545;           /* عنابي عميق */
  --bg: #F8F4ED;               /* كريمي ناعم */
  --surface: #FFFFFF;
  --border: #E8DFD0;           /* بيج فاتح للحواف */
  --text: #2D1F14;             /* إسبريسو داكن */
  --text-light: #8B7E6E;       /* رمادي دافئ */
  --shadow: 0 2px 12px rgba(139,111,71,0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100%;
  font-size: 14px;
}
body { display: flex; min-height: 100vh; }

/* ============ الشريط الجانبي ============ */
.sidebar {
  width: 240px;
  background: linear-gradient(180deg, var(--primary-dark) 0%, var(--primary) 100%);
  color: #fff;
  padding: 0;
  position: fixed;
  height: 100vh;
  right: 0;
  display: flex;
  flex-direction: column;
  box-shadow: -4px 0 20px rgba(0,0,0,0.05);
}
.sidebar-header {
  padding: 24px 16px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  text-align: center;
}
.sidebar-header img.logo {
  width: 100%;
  max-width: 200px;
  height: auto;
  display: block;
  margin: 0 auto;
}
.sidebar-header p {
  font-size: 10px;
  opacity: 0.65;
  margin-top: 6px;
  letter-spacing: 2px;
}
.sidebar-nav { flex: 1; padding: 16px 0; overflow-y: auto; }
.nav-item {
  display: block;
  padding: 12px 24px;
  color: #fff;
  text-decoration: none;
  font-size: 14px;
  cursor: pointer;
  border-right: 4px solid transparent;
  transition: all 0.15s;
}
.nav-item:hover { background: rgba(255,255,255,0.08); }
.nav-item.active {
  background: rgba(255,255,255,0.15);
  border-right-color: #fff;
  font-weight: 600;
}
.nav-icon { margin-left: 8px; font-size: 16px; }
.nav-svg {
  width: 24px;
  height: 24px;
  margin-left: 12px;
  fill: none;
  stroke: var(--accent-2, #D4B97A);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
  transition: stroke 0.18s, transform 0.18s;
  color: var(--accent-2, #D4B97A);
}
.nav-svg [fill="currentColor"] { fill: var(--accent-2, #D4B97A); }
.nav-item { display: flex; align-items: center; }
.nav-item:hover .nav-svg { stroke: #fff; transform: scale(1.06); color: #fff; }
.nav-item:hover .nav-svg [fill="currentColor"] { fill: #fff; }
.nav-item.active .nav-svg { stroke: #fff; color: #fff; }
.nav-item.active .nav-svg [fill="currentColor"] { fill: #fff; }
.sidebar-footer {
  padding: 16px 20px;
  border-top: 1px solid rgba(255,255,255,0.1);
  font-size: 12px;
  opacity: 0.7;
  text-align: center;
}

/* ============ المحتوى الرئيسي ============ */
.main {
  flex: 1;
  margin-right: 240px;
  padding: 24px 32px;
  overflow-y: auto;
}
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.page-title { font-size: 24px; font-weight: 700; color: var(--primary); }
.btn {
  padding: 10px 20px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.15s;
}
.btn:hover { background: var(--primary-light); transform: translateY(-1px); }
.btn-success { background: var(--success); }
.btn-danger { background: var(--accent); }
.btn-warning { background: var(--accent-2); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-outline {
  background: transparent;
  color: var(--primary);
  border: 1px solid var(--primary);
}

/* ============ بطاقات الإحصائيات ============ */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--surface);
  border-radius: 12px;
  padding: 20px;
  box-shadow: var(--shadow);
  border-right: 4px solid var(--primary);
}
.stat-card.success { border-color: var(--success); }
.stat-card.warning { border-color: var(--warning); }
.stat-card.danger { border-color: var(--accent); }
.stat-card.accent { border-color: var(--accent-2); }
.stat-label { font-size: 12px; color: var(--text-light); margin-bottom: 8px; }
.stat-value { font-size: 28px; font-weight: 700; color: var(--text); }
.stat-sub { font-size: 11px; color: var(--text-light); margin-top: 4px; }

/* ============ البطاقات والجداول ============ */
.card {
  background: var(--surface);
  border-radius: 12px;
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.card-title { font-size: 16px; font-weight: 700; color: var(--primary); }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
th, td {
  padding: 12px 14px;
  text-align: right;
  border-bottom: 1px solid var(--border);
}
th {
  background: #F8FAFD;
  font-weight: 700;
  color: var(--text-light);
  font-size: 12px;
  text-transform: uppercase;
}
tbody tr:hover { background: #F8FAFD; cursor: pointer; }

/* ============ الشارات (Badges) ============ */
.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}
.badge-lead { background: #E5E7EB; color: #4B5563; }
.badge-quoted { background: #DBEAFE; color: #1E40AF; }
.badge-contracted { background: #FEF3C7; color: #92400E; }
.badge-planning { background: #FED7AA; color: #9A3412; }
.badge-ready { background: #DDD6FE; color: #5B21B6; }
.badge-in_progress { background: #FCE7F3; color: #9F1239; }
.badge-completed { background: #D1FAE5; color: #065F46; }
.badge-closed { background: #E5E7EB; color: #1F2937; }
.badge-cancelled { background: #FEE2E2; color: #991B1B; }

.badge-excellent { background: #D1FAE5; color: #065F46; }
.badge-good { background: #DBEAFE; color: #1E40AF; }
.badge-fair { background: #FEF3C7; color: #92400E; }
.badge-damaged { background: #FEE2E2; color: #991B1B; }
.badge-lost { background: #1F2937; color: #fff; }

.badge-in_warehouse { background: #D1FAE5; color: #065F46; }
.badge-reserved { background: #FEF3C7; color: #92400E; }
.badge-in_event { background: #FED7AA; color: #9A3412; }
.badge-in_repair { background: #FEE2E2; color: #991B1B; }

.badge-vip { background: #FBBF24; color: #78350F; }
.badge-individual { background: #DBEAFE; color: #1E40AF; }
.badge-company { background: #DDD6FE; color: #5B21B6; }

/* ============ أزرار الإجراءات في الجداول (تعديل/حذف) ============ */
.actions-col { width: 110px; text-align: center; }
.actions-cell {
  text-align: center;
  white-space: nowrap;
  padding: 6px 4px !important;
}
.action-btn {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  width: 34px;
  height: 34px;
  font-size: 15px;
  cursor: pointer;
  margin: 0 2px;
  transition: all 0.15s;
  vertical-align: middle;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--primary);
}
.action-btn svg { display: block; }
.action-btn:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
.action-edit { color: var(--primary); }
.action-edit:hover { background: #DBEAFE; border-color: #1E40AF; color: #1E40AF; }
.action-delete { color: var(--danger); }
.action-delete:hover { background: #FEE2E2; border-color: #991B1B; color: #991B1B; }

/* ============ مستكشف المالية ============ */
.finance-explorer {
  margin-bottom: 24px;
  padding: 0;
}
.fin-controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  padding: 16px;
  border-bottom: 1px solid var(--border);
  align-items: flex-end;
  background: var(--bg);
}
.fin-ctrl { display: flex; flex-direction: column; min-width: 130px; }
.fin-ctrl label {
  font-size: 11px; color: var(--text-light);
  margin-bottom: 4px; font-weight: 600;
}
.fin-summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 1px;
  background: var(--border);
}
.fin-big-stat {
  background: var(--surface);
  padding: 18px 16px;
  text-align: center;
}
.fin-big-stat .fin-stat-label {
  font-size: 12px;
  color: var(--text-light);
  font-weight: 600;
  margin-bottom: 6px;
}
.fin-big-stat .fin-stat-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
}
.fin-big-stat .fin-stat-sub {
  font-size: 12px;
  margin-top: 4px;
  font-weight: 600;
}
.fin-revenue { background: linear-gradient(135deg, #F0F4E8 0%, #FFFFFF 100%); }
.fin-expenses { background: linear-gradient(135deg, #FCE7E7 0%, #FFFFFF 100%); }
.fin-profit { background: linear-gradient(135deg, #FFF8E0 0%, #FFFFFF 100%); }
.fin-margin { background: linear-gradient(135deg, #E8F0FE 0%, #FFFFFF 100%); }
.finance-explorer .chart-container { padding: 16px; }
#finBreakdown { padding: 0 16px 16px; max-height: 320px; overflow-y: auto; }
#finBreakdown table { width: 100%; }
#finBreakdown th, #finBreakdown td { padding: 8px 10px; }

/* ============ تبويبات المستودعات الفرعية ============ */
.warehouse-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 12px 16px 0;
  border-bottom: 1px solid var(--border);
}
.wh-tab {
  background: var(--bg);
  border: 1px solid var(--border);
  border-bottom: none;
  border-radius: 8px 8px 0 0;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-light);
  cursor: pointer;
  margin-bottom: -1px;
  transition: all 0.15s;
}
.wh-tab:hover { background: #fff; color: var(--text); }
.wh-tab.active {
  background: var(--surface);
  color: var(--primary-dark);
  border-color: var(--border);
  border-bottom: 1px solid var(--surface);
}

/* ============ بطاقات الخطط (خطط العمل والفرعية) ============ */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.plan-card {
  background: var(--surface);
  border-radius: 12px;
  border: 1px solid var(--border);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  display: flex;
  flex-direction: column;
}
.plan-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(139,111,71,0.18);
}
.plan-card-header {
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.plan-card-icon { font-size: 26px; }
.plan-card-body {
  padding: 16px;
  flex: 1;
}
.plan-stat {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  margin-bottom: 8px;
  color: var(--text-light);
}
.plan-stat strong { color: var(--text); }
.progress-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 10px;
}
.progress-bar {
  height: 8px;
  background: var(--bg);
  border-radius: 4px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--success));
  transition: width 0.4s;
}
.plan-card-actions {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  background: var(--bg);
}

/* صورة مصغّرة في صف المخزون */
.row-thumb {
  width: 72px; height: 72px;
  object-fit: contain;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #fff;
  cursor: pointer;
  transition: transform 0.15s;
}
.row-thumb:hover {
  transform: scale(1.05);
}
.thumb-empty {
  width: 72px; height: 72px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px dashed var(--border);
  border-radius: 8px;
  color: var(--text-light);
  font-size: 28px;
  background: var(--bg);
}

/* ============ النوافذ المنبثقة ============ */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); display: none;
  align-items: center; justify-content: center; z-index: 1000;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--surface); border-radius: 12px; width: 90%; max-width: 600px;
  max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.modal-header {
  padding: 20px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.modal-title { font-size: 18px; font-weight: 700; color: var(--primary); }
.modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-light); }
.modal-body { padding: 20px; }
.modal-footer {
  padding: 16px 20px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-start; gap: 8px;
}

/* ============ الحقول ============ */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 14px; font-family: inherit; background: #fff;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none; border-color: var(--primary-light);
  box-shadow: 0 0 0 3px rgba(46,117,182,0.15);
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ============ تفاصيل المناسبة ============ */
.detail-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  background: #F8FAFD; padding: 16px; border-radius: 8px; margin-bottom: 20px;
}
.detail-item { font-size: 13px; }
.detail-item strong { color: var(--text-light); display: block; margin-bottom: 2px; font-size: 11px; text-transform: uppercase; }
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
.tab {
  padding: 10px 16px; cursor: pointer; font-size: 13px; font-weight: 600;
  color: var(--text-light); border-bottom: 2px solid transparent; margin-bottom: -2px;
}
.tab.active { color: var(--primary); border-color: var(--primary); }

/* ============ الحالات والمساعدات ============ */
.empty {
  text-align: center; padding: 40px 20px; color: var(--text-light); font-size: 14px;
}
.loading { text-align: center; padding: 40px; color: var(--text-light); }
.toast {
  position: fixed; bottom: 24px; right: 50%; transform: translateX(50%);
  background: var(--text); color: #fff; padding: 12px 24px; border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 2000;
  opacity: 0; transition: opacity 0.3s;
}
.toast.show { opacity: 1; }
.toast.success { background: var(--success); }
.toast.error { background: var(--accent); }

.search-bar {
  display: flex; gap: 12px; margin-bottom: 16px;
}

/* ============ شريط علوي ============ */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: linear-gradient(135deg, var(--bg) 0%, #FFFFFF 100%);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  margin: -24px -32px 20px;
  display: flex;
  gap: 12px;
  align-items: center;
  box-shadow: 0 2px 6px rgba(139,111,71,0.05);
}
.top-search-wrap { flex: 1; position: relative; max-width: 500px; }
.top-search-wrap input {
  width: 100%;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: #fff;
  font-family: inherit;
  font-size: 13px;
}
.top-search-wrap input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(201,165,96,0.15);
}
.global-search-results {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  left: 0;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  max-height: 70vh;
  overflow-y: auto;
  z-index: 100;
  display: none;
}
.global-search-results.show { display: block; }
.gsr-section {
  padding: 8px 12px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-light);
  background: var(--bg);
  border-top: 1px solid var(--border);
}
.gsr-item {
  padding: 10px 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  border-bottom: 1px solid #f0ebe2;
}
.gsr-item:hover { background: var(--bg); }
.gsr-icon { font-size: 18px; flex-shrink: 0; }
.gsr-text { flex: 1; }
.gsr-text strong { display: block; }
.gsr-text small { color: var(--text-light); font-size: 11px; }

.top-actions { display: flex; align-items: center; gap: 10px; }
.top-stat {
  font-size: 13px;
  color: var(--text-light);
  padding: 6px 12px;
  background: #fff;
  border-radius: 8px;
  border: 1px solid var(--border);
}
.top-icon-btn {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  width: 38px;
  height: 38px;
  font-size: 16px;
  cursor: pointer;
  position: relative;
}
.top-icon-btn:hover { background: var(--bg); }
.badge-dot {
  position: absolute;
  top: -4px;
  left: -4px;
  background: var(--danger);
  color: #fff;
  font-size: 10px;
  min-width: 18px;
  height: 18px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  font-weight: 700;
}

/* ============ الرسوم البيانية ============ */
.charts-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}
.charts-grid .card { margin-bottom: 0; }
.chart-container {
  position: relative;
  height: 280px;
  width: 100%;
}
.chart-container.small { height: 240px; }
.charts-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}
.charts-row .card { margin-bottom: 0; }
@media (max-width: 1024px) {
  .charts-grid, .charts-row { grid-template-columns: 1fr; }
}
.search-input {
  flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 14px; background: #fff;
}

@media (max-width: 768px) {
  .sidebar { width: 60px; }
  .sidebar-header h1, .sidebar-header p, .nav-item span:not(.nav-icon), .sidebar-footer { display: none; }
  .nav-item { text-align: center; padding: 14px 10px; }
  .nav-icon { margin: 0; font-size: 20px; }
  .main { margin-right: 60px; padding: 16px; }
  .form-row { grid-template-columns: 1fr; }
  .detail-grid { grid-template-columns: 1fr; }
}

/* ============ الإصدار 4: الدخول والصلاحيات والأقسام الجديدة ============ */
body.locked .sidebar, body.locked .main { filter: blur(3px); pointer-events: none; user-select: none; }
#login-overlay { position: fixed; inset: 0; z-index: 3000; display: none; align-items: center; justify-content: center;
  background: linear-gradient(160deg, rgba(92,69,40,.92), rgba(139,111,71,.88)); padding: 16px; }
.login-card { background: #fff; border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 10px; }

#me-chip { background: rgba(255,255,255,.1); border-radius: 10px; padding: 10px; margin-bottom: 10px; text-align: center; }

.ph-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; background: #EFEAE1; color: var(--text); white-space: nowrap; }
.pill.ok, .pill.st-won, .pill.q-contracted { background: #DCEBD5; color: #3F5A2B; }
.pill.warn, .pill.st-quoted, .pill.q-sent { background: #FBEFD5; color: #8A5A12; }

.pill.st-meeting { background: #E3E0F3; color: #4A3C8A; }
.pill.st-contacted { background: #DCE8F3; color: #234E77; }
.muted { color: var(--text-light); }
.small { font-size: 12px; }
.nowrap { white-space: nowrap; }
.link { color: var(--primary); cursor: pointer; text-decoration: underline; }

};

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    ...opts
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: 'خطأ' }));
    throw new Error(err.error || 'حدث خطأ');
  }
  return res.json();
}

function toast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast ' + type, 3000);
}

function fmtMoney(v) {
  return (Number(v) || 0).toLocaleString('ar-SA', { minimumFractionDigits: 0 }) + ' ر.س';
}
function fmtDate(s) {
  if (!s) return '-';
  const d = new Date(s);
  return d.toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' });
}
function fmtDateTime(s) {
  if (!s) return '-';
  return new Date(s).toLocaleString('ar-SA');
}

function badge(value, labels) {
  return `<span class="badge badge-${value}">${labels[value] || value}</span>`;
}

// تصدير المخزون كـ CSV (يفتح بـ Excel)
function exportInventoryCSV() {
  const items = cache.inventory || [];
  if (!items.length) return toast('لا يوجد مخزون للتصدير', 'error');
  const headers = ['الكود','الاسم','الاسم بالإنجليزي','المستودع','الفرع','التصنيف','الكمية المتاحة','الإجمالي','سعر الإيجار','الحالة المادية','الحالة','الموقع','ملاحظات'];
  const rows = items.map(i => [
    i.item_code, i.name, i.name_en || '', i.warehouse, i.branch || 'riyadh',
    i.category_name || '', i.quantity_available, i.quantity_total, i.rental_price || 0,
    i.condition || '', i.status || '', i.location_in_warehouse || '', (i.notes || '').replace(/[\r\n]/g, ' ')
  ]);
  // BOM عشان Excel يقرأ العربية صح
  const csv = '﻿' + [headers, ...rows].map(r =>
    r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')
  ).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `inventory_${new Date().toISOString().split('T')[0]}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('تم تصدير المخزون ✓', 'success');
}

async function openEditModal(entity, id) {
  const apiPath = ENTITY_API[entity];
  if (!apiPath) return toast('نوع غير معروف', 'error');
  try {
    const item = await api(`/${apiPath}/${id}`);
    const fields = EDIT_FIELDS[entity] || [];
    let categoryOptions = '';
    if (fields.some(f => f.t === 'select-categories')) {
      const cats = await api('/categories?warehouse=' + (item.warehouse || 'accessories'));
      categoryOptions = cats.map(c => `<option value="${c.id}" ${c.id===item.category_id?'selected':''}>${c.name}</option>`).join('');
    }
    const formHtml = `<form id="edit-form" data-entity="${entity}" data-id="${id}">` +
      fields.map(f => {
        const val = item[f.n] != null ? String(item[f.n]).replace(/"/g,'&quot;') : '';
        const dirAttr = f.dir ? `dir="${f.dir}"` : '';
        const ro = f.readonly ? 'readonly' : '';
        const req = f.req ? 'required' : '';
        const hint = f.hint ? `<small style="color:var(--text-light);display:block;margin-top:2px">${f.hint}</small>` : '';
        if (f.t === 'textarea') {
          return `<div class="form-group"><label class="form-label">${f.l}</label>
            <textarea class="form-textarea" name="${f.n}" rows="2" ${dirAttr} ${ro}>${val}</textarea>${hint}</div>`;
        }
        if (f.t === 'select') {
          const opts = (f.opts||[]).map(([k,v]) => `<option value="${k}" ${k===item[f.n]?'selected':''}>${v}</option>`).join('');
          return `<div class="form-group"><label class="form-label">${f.l}</label>
            <select class="form-select" name="${f.n}" ${ro}>${opts}</select>${hint}</div>`;
        }
        if (f.t === 'select-categories') {
          return `<div class="form-group"><label class="form-label">${f.l}</label>
            <select class="form-select" name="${f.n}">${categoryOptions}</select></div>`;
        }
        return `<div class="form-group"><label class="form-label">${f.l}</label>
          <input class="form-input" type="${f.t}" name="${f.n}" value="${val}" ${dirAttr} ${ro} ${req}>${hint}</div>`;
      }).join('') + `</form>`;
    openModal(`تعديل ${ENTITY_LABEL[entity]||''}`, formHtml, `
      <button class="btn btn-success" onclick="saveEdit()">💾 حفظ التعديلات</button>
      <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
    `);
  } catch (e) {
    toast('فشل تحميل البيانات: ' + e.message, 'error');
  }
}

async function saveEdit() {
  const form = document.getElementById('edit-form');
  const entity = form.dataset.entity;
  const id = form.dataset.id;
  const apiPath = ENTITY_API[entity];
  const data = Object.fromEntries(new FormData(form));
  // remove readonly fields
  for (const f of (EDIT_FIELDS[entity]||[])) {
    if (f.readonly) delete data[f.n];
  }
  try {
    await api(`/${apiPath}/${id}`, { method: 'PUT', body: JSON.stringify(data) });
    toast('تم الحفظ ✓', 'success');
    closeModal();
    refreshCurrentPage();
  } catch (e) {
    toast('خطأ في الحفظ: ' + e.message, 'error');
  }
}

async function confirmDelete(entity, id, label) {
  const apiPath = ENTITY_API[entity];
  const entityLabel = ENTITY_LABEL[entity] || entity;
  const action = entity === 'event' ? 'إلغاء' : 'حذف';
  if (!confirm(`هل أنت متأكد من ${action} ${entityLabel}: "${label}"؟${entity==='event'?'\nسيتم تغيير الحالة إلى ملغاة.':'\nهذا الإجراء لا يمكن التراجع عنه.'}`)) return;
  try {
    await api(`/${apiPath}/${id}`, { method: 'DELETE' });
    toast(entity === 'event' ? 'تم إلغاء المناسبة' : 'تم الحذف', 'success');
    refreshCurrentPage();
  } catch (e) {
    toast('فشل الحذف: ' + e.message, 'error');
  }
}

function refreshCurrentPage() {
  // إعادة تحميل الصفحة الحالية بعد أي تعديل
  if (typeof renderPage === 'function') renderPage();
}

function openModal(title, body, footer = '') {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-footer').innerHTML = footer;
  document.getElementById('modal').classList.add('show');
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }

function renderPage() {
  destroyCharts();
  const c = document.getElementById('page-content');
  c.innerHTML = '<div class="loading">جارِ التحميل...</div>';
  switch (currentPage) {
    case 'dashboard': return renderDashboard();
    case 'events': return renderEvents();
    case 'customers': return renderCustomers();
    case 'inventory': return renderInventory();
    case 'teams': return renderTeams();
    case 'finance': return renderFinance();
    case 'reports': return renderReports();
    case 'sync': return renderSync();
    case 'raw_materials': return (typeof renderRawMaterials === 'function' ? renderRawMaterials() : null);
    case 'appointments': return (typeof renderAppointments === 'function' ? renderAppointments() : null);
    case 'calendar': return (typeof renderCalendar === 'function' ? renderCalendar() : null);
    case 'sub_plans': return (typeof renderSubPlans === 'function' ? renderSubPlans() : null);
    case 'work_plans': location.href = '/workplans'; return;
    case 'expenses': location.href = '/expenses'; return;
  }
}

          </tbody>
        </table>` : '<div class="empty">لا يوجد سجل</div>'}
      </div>

      <div class="card" style="background:#FFF8E7;border-right:4px solid var(--warning)">
        <div style="font-size:14px">
          <strong>📌 كيف تعمل المزامنة:</strong>
          <ol style="margin:8px 24px 0">
            <li>يجلب البيانات من الجداول الخمسة عبر CSV (يحتاج صلاحية: "أي شخص لديه الرابط = عارض")</li>
            <li>يخزّن البيانات الخام في جداول داخلية (sheet_contracts, sheet_expenses, sheet_purchases)</li>
            <li>يربط كل عقد بمناسبة في النظام عبر <strong>رقم أمر التشغيل (O1001..)</strong></li>
            <li>ينشئ عملاء جدد إن لم يكونوا موجودين</li>
            <li>يجمع كل المصاريف لكل مناسبة ويحسب: <strong>التكلفة الإجمالية + صافي الربح</strong></li>
          </ol>
        </div>
      </div>
    `;
    document.getElementById('page-content').innerHTML = html;
  } catch (e) {
    document.getElementById('page-content').innerHTML = '<div class="empty">' + e.message + '</div>';
  }
}

async function runSync() {
  const btn = document.getElementById('sync-btn');
  btn.disabled = true;
  btn.textContent = '⏳ جارِ المزامنة...';
  toast('جارِ المزامنة من Google Sheets...');
  try {
    const r = await api('/sync/run', { method: 'POST' });
    if (r.success) {
      const total = Object.values(r.sheets || {}).reduce((s,v) => s+v, 0);
      toast(`✓ تمت المزامنة: ${total} صف، ${r.merged?.events_added||0} مناسبة جديدة، ${r.merged?.events_updated||0} محدثة`, 'success');
      setTimeout(() => renderSync(), 1500);
    } else {
      toast('✗ فشلت المزامنة: ' + (r.error||'خطأ'), 'error');
      btn.disabled = false;
      btn.textContent = '▶ مزامنة الآن';
    }
  } catch (e) {
    toast(e.message, 'error');
    btn.disabled = false;
    btn.textContent = '▶ مزامنة الآن';
  }
}

async function runExcelExport() {
  const btn = document.getElementById('excel-export-btn');
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = '⏳ جارِ التصدير...';
  toast('جارِ تصدير البيانات إلى ملفات Excel محلية...');
  try {
    const r = await api('/sync/export-excel', { method: 'POST' });
    if (r.success) {
      const total = Object.values(r.files || {}).reduce((s,f) => s + (f.rows||0), 0);
      const fileCount = Object.keys(r.files || {}).length;
      toast(`✓ تم تصدير ${fileCount} ملف Excel (${total} صف) إلى ${r.exports_dir}`, 'success');
    } else {
      toast('✗ فشل التصدير: ' + (r.error || 'تأكد من تثبيت openpyxl: pip install openpyxl'), 'error');
    }
  } catch (e) {
    toast(e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
}

// ============ مستكشف المصروفات التفاعلي ============
const FIN_CAT_LABELS = {materials:'خامات',transport:'نقل/مواصلات',food:'ضيافة',rental:'إيجارات',
                       salaries:'أجور',utilities:'خدمات',maintenance:'صيانة',office:'مكتبية',misc:'متنوعة'};

function renderFinanceCharts(stats) {
  if (typeof Chart === 'undefined') return;
  // ضع البيانات المتاحة في cache للوصول من updateFinExplorer
  window.__finData = {
    monthly_expenses: stats.monthly_expenses || [],
    monthly_revenue: stats.monthly_revenue || [],
    by_vendor: stats.expenses_by_vendor || [],
    by_category: stats.expenses_by_category || [],
    by_user: stats.expenses_by_user || [],
    total_revenue: stats.total_revenue || 0,
    total_collected: stats.total_collected || 0,
    total_expenses: stats.total_expenses || 0,
  };
  // قيم افتراضية للفترة (آخر 6 أشهر)
  const today = new Date();
  const sixAgo = new Date(); sixAgo.setMonth(sixAgo.getMonth()-5); sixAgo.setDate(1);
  const fEl = document.getElementById('finFrom');
  const tEl = document.getElementById('finTo');
  if (fEl && !fEl.value) fEl.value = sixAgo.toISOString().split('T')[0];
  if (tEl && !tEl.value) tEl.value = today.toISOString().split('T')[0];
  populateFinFilter();
  updateFinExplorer();
}

function populateFinFilter() {
  const view = document.getElementById('finView')?.value || 'month';
  const sel = document.getElementById('finFilter');
  const ctrl = document.getElementById('finFilterCtrl');
  if (!sel || !ctrl) return;
  const data = window.__finData || {};
  let opts = '<option value="">— الكل —</option>';
  let hidden = false;
  if (view === 'vendor') {
    (data.by_vendor || []).forEach(v => { opts += `<option value="${v.vendor}">${v.vendor}</option>`; });
  } else if (view === 'category') {
    (data.by_category || []).forEach(c => { opts += `<option value="${c.cat}">${FIN_CAT_LABELS[c.cat]||c.cat}</option>`; });
  } else if (view === 'user') {
    (data.by_user || []).forEach(u => { opts += `<option value="${u.user_name}">${u.user_name}</option>`; });
  } else {
    // month: أخفي الفلتر لأن الفترة تحدد كل شيء
    hidden = true;
  }
  sel.innerHTML = opts;
  ctrl.style.visibility = hidden ? 'hidden' : 'visible';
}

function resetFinFilter() {
  const today = new Date();
  const sixAgo = new Date(); sixAgo.setMonth(sixAgo.getMonth()-5); sixAgo.setDate(1);
  document.getElementById('finFrom').value = sixAgo.toISOString().split('T')[0];
  document.getElementById('finTo').value = today.toISOString().split('T')[0];
  document.getElementById('finView').value = 'month';
  document.getElementById('finFilter').value = '';
  populateFinFilter();
  updateFinExplorer();
}

function updateFinExplorer() {
  const data = window.__finData || {};
  const view = document.getElementById('finView')?.value || 'month';
  const fromS = document.getElementById('finFrom')?.value;
  const toS = document.getElementById('finTo')?.value;
  const filter = document.getElementById('finFilter')?.value || '';
  populateFinFilter();
  // أعد ضبط قيمة الفلتر بعد تحديث الخيارات
  document.getElementById('finFilter').value = filter;

  // فلترة الشهور حسب الفترة
  const inRange = m => {
    if (!fromS && !toS) return true;
    return (!fromS || m >= fromS.slice(0,7)) && (!toS || m <= toS.slice(0,7));
  };

  // إيرادات/مصروفات حسب الشهر داخل الفترة
  const monRevs = (data.monthly_revenue || []).filter(r => inRange(r.month));
  const monExps = (data.monthly_expenses || []).filter(r => inRange(r.month));
  let totalRev = monRevs.reduce((s,r) => s + (r.revenue||0), 0);
  let totalExp = monExps.reduce((s,r) => s + (r.total||0), 0);

  // عند الفلترة بمورد/تصنيف/موظف، نعدّل الإجماليات
  let breakdown = '';
  let chartData = null;
  let chartType = 'bar';
  let chartLabels = [];
  let chartDatasets = [];

  if (view === 'month') {
    // محور x = الشهر، أعمدة الإيرادات والمصروفات
    const allMonths = Array.from(new Set([
      ...monRevs.map(r => r.month),
      ...monExps.map(r => r.month)
    ])).sort();
    const revByM = Object.fromEntries(monRevs.map(r => [r.month, r.revenue]));
    const colByM = Object.fromEntries(monRevs.map(r => [r.month, r.collected]));
    const expByM = Object.fromEntries(monExps.map(r => [r.month, r.total]));
    chartLabels = allMonths;
    chartDatasets = [
      { label: 'الإيرادات', data: allMonths.map(m => revByM[m]||0), backgroundColor: ABELA_COLORS.success || '#7A8A5F' },
      { label: 'المتحصّل', data: allMonths.map(m => colByM[m]||0), backgroundColor: ABELA_COLORS.accent || '#C9A560' },
      { label: 'المصروفات', data: allMonths.map(m => expByM[m]||0), backgroundColor: ABELA_COLORS.danger || '#A04545' },
    ];
    // ربحية شهرية
    breakdown = `<table><thead><tr><th>الشهر</th><th>إيرادات</th><th>مصروفات</th><th>الربح</th><th>الهامش</th></tr></thead><tbody>` +
      allMonths.map(m => {
        const r = revByM[m]||0, e = expByM[m]||0, p = r-e;
        const margin = r ? Math.round((p/r)*100) : 0;
        return `<tr><td><strong>${m}</strong></td><td>${fmtMoney(r)}</td><td>${fmtMoney(e)}</td>
                <td style="color:${p>=0?'var(--success)':'var(--danger)'};font-weight:700">${fmtMoney(p)}</td>
                <td>${margin}%</td></tr>`;
      }).join('') + `</tbody></table>`;
  } else if (view === 'vendor') {
    let rows = data.by_vendor || [];
    if (filter) rows = rows.filter(v => v.vendor === filter);
    chartLabels = rows.map(v => v.vendor);
    chartDatasets = [{
      label: 'إجمالي الصرف', data: rows.map(v => v.total),
      backgroundColor: PALETTE,
    }];
    chartType = filter ? 'doughnut' : 'bar';
    if (filter) {
      totalExp = rows.reduce((s,r) => s + (r.total||0), 0);
    }
    breakdown = `<table><thead><tr><th>المورد</th><th>الإجمالي</th><th>عدد الفواتير</th></tr></thead><tbody>` +
      rows.map(v => `<tr><td><strong>${v.vendor}</strong></td><td>${fmtMoney(v.total)}</td><td>${v.n}</td></tr>`).join('') +
      `</tbody></table>`;
  } else if (view === 'category') {
    let rows = data.by_category || [];
    if (filter) rows = rows.filter(c => c.cat === filter);
    chartLabels = rows.map(c => FIN_CAT_LABELS[c.cat]||c.cat);
    chartDatasets = [{ data: rows.map(c => c.total), backgroundColor: PALETTE, borderWidth:2, borderColor:'#fff' }];
    chartType = 'doughnut';
    if (filter) {
      totalExp = rows.reduce((s,r) => s + (r.total||0), 0);
    }
    breakdown = `<table><thead><tr><th>التصنيف</th><th>الإجمالي</th><th>عدد العمليات</th></tr></thead><tbody>` +
      rows.map(c => `<tr><td><strong>${FIN_CAT_LABELS[c.cat]||c.cat}</strong></td><td>${fmtMoney(c.total)}</td><td>${c.n}</td></tr>`).join('') +
      `</tbody></table>`;
  } else if (view === 'user') {
    let rows = data.by_user || [];
    if (filter) rows = rows.filter(u => u.user_name === filter);
    chartLabels = rows.map(u => u.user_name);
    chartDatasets = [{ label: 'إجمالي الصرف', data: rows.map(u => u.total), backgroundColor: PALETTE }];
    if (filter) {
      totalExp = rows.reduce((s,r) => s + (r.total||0), 0);
    }
    breakdown = `<table><thead><tr><th>الموظف</th><th>الدور</th><th>عدد العمليات</th><th>الإجمالي</th></tr></thead><tbody>` +
      rows.map(u => `<tr><td><strong>${u.user_name}</strong></td><td>${u.role||'-'}</td><td>${u.n||0}</td><td>${fmtMoney(u.total||0)}</td></tr>`).join('') +
      `</tbody></table>`;
  }

  // البطاقات الكبيرة
  const profit = totalRev - totalExp;
  const margin = totalRev > 0 ? (profit/totalRev)*100 : 0;
  document.getElementById('finStatRev').textContent = fmtMoney(totalRev);
  document.getElementById('finStatExp').textContent = fmtMoney(totalExp);
  const profitEl = document.getElementById('finStatProfit');
  profitEl.textContent = fmtMoney(profit);
  profitEl.style.color = profit >= 0 ? 'var(--success)' : 'var(--danger)';
  document.getElementById('finStatMargin').textContent = margin.toFixed(1) + '%';
  // مؤشر صحة
  const ratio = totalRev > 0 ? totalExp/totalRev : 0;
  const health = ratio < 0.6 ? '🟢 آمن'
                : ratio < 0.85 ? '🟡 متوسط'
                : '🔴 مرتفع';
  document.getElementById('finStatHealth').textContent = health;

  // ارسم المخطط
  const ctx = document.getElementById('chart-fin-explorer');
  if (window.__finChart) { window.__finChart.destroy(); }
  if (ctx && chartLabels.length) {
    window.__finChart = new Chart(ctx, {
      type: chartType,
      data: { labels: chartLabels, datasets: chartDatasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: chartType === 'doughnut' || chartDatasets.length > 1, position: 'bottom' },
          tooltip: { callbacks: { label: c => {
            const v = c.parsed.y ?? c.parsed.x ?? c.parsed;
            return `${c.dataset.label || c.label}: ${fmtMoney(v)}`;
          }}}
        },
        scales: chartType === 'bar' ? {
          y: { beginAtZero: true, ticks: { callback: v => v.toLocaleString('ar-SA') } }
        } : {}
      }
    });
  } else if (ctx) {
    const c = ctx.getContext('2d');
    c.clearRect(0,0,ctx.width,ctx.height);
    c.fillStyle = '#999'; c.font = '14px sans-serif'; c.textAlign='center';
    c.fillText('لا توجد بيانات للفترة المحددة', ctx.width/2, ctx.height/2);
  }

  // الجدول التفصيلي
  document.getElementById('finBreakdown').innerHTML = breakdown;
}

function renderDashboardCharts(events, items) {
  // إعدادات عامة لكل الرسوم
  Chart.defaults.font.family = "'Segoe UI', Tahoma, Arial, sans-serif";
  Chart.defaults.font.size = 12;
  Chart.defaults.color = ABELA_COLORS.text;

  // 1. رسم الإيرادات الشهرية (Line)
  const months = [];
  const revByMonth = {};
  for (let i = 5; i >= 0; i--) {
    const d = new Date();
    d.setMonth(d.getMonth() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const label = d.toLocaleDateString('ar-SA', { month: 'long' });
    months.push({ key, label });
    revByMonth[key] = 0;
  }
  events.forEach(e => {
    if (!e.event_date) return;
    const k = e.event_date.slice(0, 7);
    if (k in revByMonth && e.status !== 'cancelled') {
      revByMonth[k] += (e.total_price || 0);
    }
  });
  const ctx1 = document.getElementById('chart-revenue');
  if (ctx1) {
    charts.push(new Chart(ctx1, {
      type: 'line',
      data: {
        labels: months.map(m => m.label),
        datasets: [{
          label: 'الإيرادات (ر.س)',
          data: months.map(m => revByMonth[m.key]),
          borderColor: ABELA_COLORS.primary,
          backgroundColor: ABELA_COLORS.primary + '22',
          tension: 0.4,
          fill: true,
          pointBackgroundColor: ABELA_COLORS.accent,
          pointBorderColor: '#fff',
          pointRadius: 6,
          pointHoverRadius: 8,
          borderWidth: 3
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: ABELA_COLORS.primaryDark,
            padding: 12, titleFont: { size: 13 }, bodyFont: { size: 12 },
            callbacks: { label: (c) => fmtMoney(c.parsed.y) }
          }
        },
        scales: {
          y: { beginAtZero: true, grid: { color: ABELA_COLORS.border }, ticks: { callback: (v) => v.toLocaleString('ar-SA') + ' ر.س', font: { size: 10 } } },
          x: { grid: { display: false } }
        }
      }
    }));
  }

  // 2. توزيع المناسبات حسب النوع (Doughnut)
  const byType = {};
  events.forEach(e => { byType[e.event_type] = (byType[e.event_type] || 0) + 1; });
  const ctx2 = document.getElementById('chart-events-type');
  if (ctx2 && Object.keys(byType).length) {
    charts.push(new Chart(ctx2, {
      type: 'doughnut',
      data: {
        labels: Object.keys(byType).map(k => EVENT_TYPES[k] || k),
        datasets: [{
          data: Object.values(byType),
          backgroundColor: PALETTE,
          borderColor: '#fff',
          borderWidth: 3,
          hoverOffset: 8
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { padding: 12, font: { size: 11 }, usePointStyle: true } },
          tooltip: { backgroundColor: ABELA_COLORS.primaryDark, padding: 12 }
        },
        cutout: '60%'
      }
    }));
  }

  // 3. حالات المناسبات (Bar)
  const byStatus = {};
  events.forEach(e => { byStatus[e.status] = (byStatus[e.status] || 0) + 1; });
  const ctx3 = document.getElementById('chart-events-status');
  if (ctx3 && Object.keys(byStatus).length) {
    charts.push(new Chart(ctx3, {
      type: 'bar',
      data: {
        labels: Object.keys(byStatus).map(k => STATUS_LABELS[k] || k),
        datasets: [{
          data: Object.values(byStatus),
          backgroundColor: PALETTE,
          borderRadius: 6,
          borderSkipped: false
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { backgroundColor: ABELA_COLORS.primaryDark, padding: 10 }
        },
        scales: {
          y: { beginAtZero: true, grid: { color: ABELA_COLORS.border }, ticks: { stepSize: 1, font: { size: 10 } } },
          x: { grid: { display: false }, ticks: { font: { size: 10 } } }
        }
      }
    }));
  }

  // 4. توزيع المخزون (Pie)
  const byWarehouse = { decorations: 0, accessories: 0 };
  items.forEach(i => { byWarehouse[i.warehouse] = (byWarehouse[i.warehouse] || 0) + 1; });
  const ctx4 = document.getElementById('chart-inventory');
  if (ctx4) {
    charts.push(new Chart(ctx4, {
      type: 'pie',
      data: {
        labels: ['🎨 ديكورات', '✨ اكسسوارات'],
        datasets: [{
          data: [byWarehouse.decorations || 0, byWarehouse.accessories || 0],
          backgroundColor: [ABELA_COLORS.primary, ABELA_COLORS.accent],
          borderColor: '#fff',
          borderWidth: 3,
          hoverOffset: 8
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { padding: 12, font: { size: 11 }, usePointStyle: true } },
          tooltip: { backgroundColor: ABELA_COLORS.primaryDark, padding: 10 }
        }
      }
    }));
  }

  // 5. حالة القطع (Polar Area)
  const byCondition = {};
  items.forEach(i => { byCondition[i.condition] = (byCondition[i.condition] || 0) + 1; });
  const ctx5 = document.getElementById('chart-condition');
  if (ctx5 && Object.keys(byCondition).length) {
    const condColors = { excellent: ABELA_COLORS.success, good: ABELA_COLORS.primary, fair: ABELA_COLORS.warning, damaged: ABELA_COLORS.danger, lost: ABELA_COLORS.primaryDark };
    charts.push(new Chart(ctx5, {
      type: 'polarArea',
      data: {
        labels: Object.keys(byCondition).map(k => CONDITION_LABELS[k] || k),
        datasets: [{
          data: Object.values(byCondition),
          backgroundColor: Object.keys(byCondition).map(k => (condColors[k] || ABELA_COLORS.primary) + 'cc'),
          borderColor: '#fff',
          borderWidth: 2
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { padding: 12, font: { size: 11 }, usePointStyle: true } },
          tooltip: { backgroundColor: ABELA_COLORS.primaryDark, padding: 10 }
        },
        scales: { r: { ticks: { display: false }, grid: { color: ABELA_COLORS.border } } }
      }
    }));
  }
}

function filterStatus(status) {
  if (!cache.events) return;
  const filtered = status ? cache.events.filter(e => e.status === status) : cache.events;
  const tbody = document.querySelector('#events-table tbody');
  tbody.innerHTML = filtered.map(e => `
    <tr onclick="showEventDetails(${e.id})">
      <td><strong>${e.event_code}</strong></td>
      <td>${e.title}</td>
      <td>${e.customer_name}</td>
      <td>${EVENT_TYPES[e.event_type] || e.event_type}</td>
      <td>${fmtDate(e.event_date)}</td>
      <td>${e.guests_count || '-'}</td>
      <td>${fmtMoney(e.total_price)}</td>
      <td>${badge(e.status, STATUS_LABELS)}</td>
      <td class="actions-cell">${rowActions('event', e.id, e.title)}</td>
    </tr>
  `).join('');
}

async function saveEvent() {
  const form = document.getElementById('event-form');
  const data = Object.fromEntries(new FormData(form));
  if (!data.customer_id || !data.title || !data.event_date) {
    return toast('املأ الحقول المطلوبة', 'error');
  }
  data.customer_id = Number(data.customer_id);
  data.guests_count = Number(data.guests_count) || null;
  data.total_price = Number(data.total_price) || 0;
  data.status = 'lead';
  try {
    const r = await api('/events', { method: 'POST', body: JSON.stringify(data) });
    closeModal();
    toast(`تمت إضافة المناسبة: ${r.event_code}`, 'success');
    renderEvents();
  } catch (e) { toast(e.message, 'error'); }
}

function switchInvTab(btn, w) {
  document.querySelectorAll('.wh-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('inv-warehouse').value = w;
  filterInventory();
}
function filterInventory() {
  if (!cache.inventory) return;
  const q = document.getElementById('inv-search').value.toLowerCase();
  const w = document.getElementById('inv-warehouse').value;
  const s = document.getElementById('inv-status').value;
  let filtered = cache.inventory;
  if (q) filtered = filtered.filter(i => i.name.toLowerCase().includes(q) || i.item_code.toLowerCase().includes(q));
  if (w) {
    if (w === 'zulfi') filtered = filtered.filter(i => i.branch === 'zulfi');
    else if (w === 'raw_riyadh') filtered = filtered.filter(i => i.warehouse === 'factory_raw' && (i.branch || 'riyadh') === 'riyadh');
    else if (w === 'raw_zulfi') filtered = filtered.filter(i => i.warehouse === 'factory_raw' && i.branch === 'zulfi');
    else filtered = filtered.filter(i => i.warehouse === w && (i.branch || 'riyadh') === 'riyadh');
  }
  if (s) filtered = filtered.filter(i => i.status === s);
  document.querySelector('#inventory-table tbody').innerHTML = filtered.map(i => `
    <tr onclick="showItemDetails(${i.id})">
      <td>${itemThumb(i.main_image)}</td>
      <td><strong style="font-family:monospace">${i.item_code}</strong></td>
      <td>${i.name}<br><small style="color:var(--text-light)">${i.category_name || ''}</small></td>
      <td>${i.warehouse === 'decorations' ? '🎨 ديكورات' : '✨ اكسسوارات'}</td>
      <td><strong>${i.quantity_available}</strong> / ${i.quantity_total}</td>
      <td>${fmtMoney(i.rental_price)}</td>
      <td>${badge(i.condition, CONDITION_LABELS)}</td>
      <td>${i.location_in_warehouse || '-'}</td>
      <td>${badge(i.status, ITEM_STATUS_LABELS)}</td>
      <td class="actions-cell">${rowActions('inventory', i.id, i.name)}</td>
    </tr>
  `).join('');
}

// قائمة المناسبات → اضغط مناسبة → اضغط خطة → بطاقات الخطط الفرعية مع نسبة الإنجاز
async function renderWorkPlansList() {
  try {
    const [events, plans] = await Promise.all([api('/events'), api('/workplans')]);
    // اربط كل مناسبة بخططها
    const byEvent = {};
    plans.forEach(p => {
      if (!byEvent[p.event_id]) byEvent[p.event_id] = [];
      byEvent[p.event_id].push(p);
    });
    const html = `
      <div class="page-header">
        <h2 class="page-title">📋 خطط العمل</h2>
        <a href="/dashboard/plan_builder.html" class="btn">+ بناء خطة جديدة</a>
      </div>
      <div class="card">
        <div class="search-bar">
          <input class="search-input" id="wp-search" placeholder="بحث بالعميل أو الكود..." oninput="filterWorkPlans()">
        </div>
        <table id="workplans-table">
          <thead><tr>
            <th>كود المناسبة</th><th>أمر التشغيل</th><th>العميل</th>
            <th>نوع المناسبة</th><th>التاريخ المتوقع</th>
            <th>عدد الخطط</th><th>حالة الخطط</th><th class="actions-col">عرض</th>
          </tr></thead>
          <tbody>
            ${events.map(e => {
              const evPlans = byEvent[e.id] || [];
              const statusBadge = evPlans.length === 0
                ? '<span class="badge badge-lead">بدون خطة</span>'
                : evPlans.some(p => p.status==='executing' || p.status==='in_progress')
                  ? '<span class="badge badge-in_progress">قيد التنفيذ</span>'
                  : evPlans.some(p => p.status==='approved')
                    ? '<span class="badge badge-completed">معتمدة</span>'
                    : '<span class="badge badge-quoted">مسودة</span>';
              return `<tr onclick="openEventWorkPlans(${e.id})" style="cursor:pointer">
                <td><strong>${e.event_code}</strong></td>
                <td>${e.operation_order || '-'}</td>
                <td>${e.customer_name}</td>
                <td>${EVENT_TYPES[e.event_type] || e.event_type}</td>
                <td>${fmtDate(e.event_date)}</td>
                <td><strong>${evPlans.length}</strong></td>
                <td>${statusBadge}</td>
                <td class="actions-cell"><button class="action-btn action-edit" onclick="event.stopPropagation();openEventWorkPlans(${e.id})">📂</button></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;
    document.getElementById('page-content').innerHTML = html;
    cache.workPlansEvents = events;
    cache.workPlansByEvent = byEvent;
  } catch (e) {
    document.getElementById('page-content').innerHTML = '<div class="empty">' + e.message + '</div>';
  }
}

function filterWorkPlans() {
  const q = (document.getElementById('wp-search')?.value || '').toLowerCase();
  const events = (cache.workPlansEvents || []).filter(e =>
    !q || e.customer_name.toLowerCase().includes(q) || (e.event_code||'').toLowerCase().includes(q)
       || (e.operation_order||'').toLowerCase().includes(q));
  const byEvent = cache.workPlansByEvent || {};
  document.querySelector('#workplans-table tbody').innerHTML = events.map(e => {
    const evPlans = byEvent[e.id] || [];
    return `<tr onclick="openEventWorkPlans(${e.id})" style="cursor:pointer">
      <td><strong>${e.event_code}</strong></td>
      <td>${e.operation_order || '-'}</td>
      <td>${e.customer_name}</td>
      <td>${EVENT_TYPES[e.event_type] || e.event_type}</td>
      <td>${fmtDate(e.event_date)}</td>
      <td><strong>${evPlans.length}</strong></td>
      <td></td>
      <td class="actions-cell"><button class="action-btn action-edit" onclick="event.stopPropagation();openEventWorkPlans(${e.id})">📂</button></td>

async function openEventWorkPlans(eventId) {
  try {
    const e = await api('/events/' + eventId);
    const plans = (await api('/workplans')).filter(p => p.event_id === eventId);
    const html = `
      <div class="page-header" style="align-items:flex-start">
        <div>
          <a href="#" onclick="event.preventDefault();renderWorkPlansList()" style="color:var(--text-light);text-decoration:none;font-size:13px">‹ رجوع لقائمة خطط العمل</a>

          <small style="color:var(--text-light)">${e.event_code} · ${e.operation_order || ''} · ${fmtDate(e.event_date)}${e.actual_date ? ' (فعلي: '+fmtDate(e.actual_date)+')' : ''}</small>

        : '<div class="card-grid">' + plans.map(p => renderPlanCard(p)).join('') + '</div>'

    `;
    document.getElementById('page-content').innerHTML = html;
  } catch (err) { toast(err.message, 'error'); }
}

  const isWarehouse = p.title && p.title.includes('warehouse');

  const icon = isWarehouse ? '📦' : isFactory ? '🏭' : '📋';
  const statusColor = {draft:'#E5E7EB', submitted:'#DBEAFE', approved:'#D1FAE5',
                       executing:'#FED7AA', completed:'#D1FAE5', closed:'#E5E7EB'}[p.status] || '#E5E7EB';
  const itemsCount = p.items_count || 0;
  return `
    <div class="plan-card" onclick="openPlanDetails(${p.id})">
      <div class="plan-card-header" style="background:${statusColor}">
        <span class="plan-card-icon">${icon}</span>
        <div>
          <strong>${p.plan_code}</strong>
          <small style="display:block;color:var(--text-light)">${p.title.replace(/\[(warehouse|factory)\]/g,'').trim()}</small>

      </div>
      <div class="plan-card-body">
        <div class="plan-stat"><span>📑 البنود</span><strong>${itemsCount}</strong></div>
        <div class="plan-stat"><span>📊 الحالة</span><span class="badge">${p.status}</span></div>
        <div class="plan-stat"><span>📋 الفرعية</span><strong>${p.checklists_count || 0}</strong></div>
      </div>
      <div class="plan-card-actions">
        <button class="action-btn action-edit" onclick="event.stopPropagation();openPlanDetails(${p.id})">عرض/تعديل ✏️</button>
        <button class="action-btn action-delete" onclick="event.stopPropagation();confirmDelete('workplan',${p.id},'${p.plan_code}')">🗑️</button>
      </div>
    </div>
  `;
}

function renderSubPlanCard(sp) {
  const total = sp.total_items || 0;
  const done = sp.picked_items || 0;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  const teamIcons = {decorations:'🎨', accessories:'✨', factory:'🏭',
                     hospitality:'🍽️', purchasing:'🛒', risk:'⚠️',
                     execution:'⚙️', supervision:'👁️'};
  const icon = teamIcons[sp.warehouse] || '📋';
  return `
    <div class="plan-card">
      <div class="plan-card-header" style="background:#F8F4ED">
        <span class="plan-card-icon">${icon}</span>
        <div>
          <strong>${sp.warehouse}</strong>
          <small style="display:block;color:var(--text-light)">${sp.assignee_name || 'غير مسند'}</small>
        </div>
      </div>
      <div class="plan-card-body">
        <div class="progress-row">

        </div>
        <div class="plan-stat"><span>الحالة</span><span class="badge">${sp.status}</span></div>
      </div>
    </div>
  `;
}

async function renderTeams() {
  try {
    const [teams, users, subplans, events] = await Promise.all([
      api('/teams'),
      api('/users'),
      api('/sub-plans').catch(() => []),
      api('/events'),
    ]);
    cache._teamsData = { teams, users, subplans, events };

    const teamMembers = (team) => {
      const allowedRoles = TEAM_TYPE_ROLE_MAP[team.type] || [];
      return users.filter(u => u.team_id === team.id || allowedRoles.includes(u.role));
    };
    const teamPlans = (team) => {
      const planType = TEAM_TYPE_PLAN_MAP[team.type];
      if (!planType) return [];
      return subplans.filter(p => p.plan_type === planType);
    };

    const html = `
      <div class="page-header">
        <h2 class="page-title">👷 الفرق (${teams.length})</h2>
        <small style="color:var(--text-light)">اضغط على بطاقة الفريق لعرض خططه ومهامه</small>
      </div>
      <div class="card-grid">
        ${teams.map(t => {
          const members = teamMembers(t);
          const tplans = teamPlans(t);
          const activePlans = tplans.filter(p => p.status !== 'completed' && p.status !== 'closed');
          const completedPlans = tplans.filter(p => p.status === 'completed' || p.status === 'closed');
          const totalItems = tplans.reduce((s,p) => s + (p.total_items || 0), 0);
          const doneItems = tplans.reduce((s,p) => s + (p.done_items || 0), 0);
          const pct = totalItems ? Math.round((doneItems/totalItems)*100) : 0;
          return `
            <div class="plan-card" onclick="openTeamPage(${t.id})">
              <div class="plan-card-header" style="background:linear-gradient(135deg,var(--primary-light),var(--accent));color:#fff">
                <span class="plan-card-icon">${TEAM_ICONS[t.type] || '👥'}</span>
                <div>
                  <strong>${t.name}</strong>
                  <small style="display:block;opacity:0.9">${t.description || ''}</small>
                </div>
              </div>
              <div class="plan-card-body">
                <div class="plan-stat"><span>👤 الأعضاء</span><strong>${members.length}</strong></div>
                <div class="plan-stat"><span>📋 خطط نشطة</span><strong>${activePlans.length}</strong></div>
                <div class="plan-stat"><span>✅ مكتملة</span><strong>${completedPlans.length}</strong></div>
                <div class="progress-row" style="margin-top:10px">
                  <small>${doneItems}/${totalItems} بند منجز</small>
                  <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
                  <small style="color:var(--primary);font-weight:700">${pct}%</small>
                </div>
              </div>
              <div class="plan-card-actions">
                <button class="action-btn action-edit" onclick="event.stopPropagation();openTeamPage(${t.id})">📂 عرض الفريق</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
    document.getElementById('page-content').innerHTML = html;
  } catch (e) {
    document.getElementById('page-content').innerHTML = '<div class="empty">' + e.message + '</div>';
  }
}

async function openTeamPage(teamId) {
  try {
    const data = cache._teamsData || {};
    const team = (data.teams || []).find(t => t.id === teamId);
    if (!team) return toast('فريق غير موجود', 'error');

    const allowedRoles = TEAM_TYPE_ROLE_MAP[team.type] || [];
    const members = (data.users || []).filter(u =>
      u.team_id === team.id || allowedRoles.includes(u.role));
    const planType = TEAM_TYPE_PLAN_MAP[team.type];
    const subplans = planType ? (data.subplans || []).filter(p => p.plan_type === planType) : [];

    // اجلب المهام للفريق (event_tasks لكل عضو)
    const memberIds = new Set(members.map(m => m.id));
    let allTasks = [];
    try {
      // نجمع المهام عبر كل المناسبات النشطة (طريقة بسيطة)
      const events = data.events || [];
      const promises = events.slice(0, 30).map(e =>
        api('/events/' + e.id).then(d => (d.tasks || []).map(t => ({...t, event_title:d.title, event_code:d.event_code, event_date:d.event_date})))
      );
      const results = await Promise.all(promises);
      allTasks = results.flat().filter(t => memberIds.has(t.assigned_to));

    const html = `
      <div class="page-header" style="align-items:flex-start">

              <tr>
                <td><strong>${u.full_name}</strong></td>
                <td><code>${u.username}</code></td>
                <td>${ROLE_LABELS[u.role] || u.role}</td>
                <td dir="ltr">${u.phone || '-'}</td>
                <td>${u.is_active ? '<span class="badge badge-completed">نشط</span>' : '<span class="badge badge-cancelled">معطّل</span>'}</td>
              </tr>
            `).join('') : '<tr><td colspan="5" class="empty">لا يوجد أعضاء معيّنون</td></tr>'}
          </tbody>
        </table>
      </div>

      <!-- ===== الخطط الفرعية للفريق ===== -->
      <h3 style="margin:24px 0 10px;color:var(--primary)">📋 خطط الفريق (${subplans.length})</h3>
      ${subplans.length === 0
        ? '<div class="card" style="padding:24px;text-align:center;color:var(--text-light)">لا توجد خطط فرعية مسندة لهذا الفريق حالياً.</div>'

          <tbody>${Object.entries(byType).map(([k,v]) => `
            <tr><td>${EVENT_TYPES[k]}</td><td><strong>${v}</strong></td><td>${((v/events.length)*100).toFixed(1)}%</td></tr>
          `).join('')}</tbody>
        </table>
      </div>
      <div class="card">
        <div class="card-header"><h3 class="card-title">🏆 أكثر القطع استخدامًا</h3></div>
        <table>
          <thead><tr><th>الكود</th><th>الصنف</th><th>عدد مرات الاستخدام</th><th>تكلفة الشراء</th></tr></thead>
          <tbody>${topUsed.map(i => `
            <tr><td><strong>${i.item_code}</strong></td><td>${i.name}</td><td>${i.times_used}</td><td>${fmtMoney(i.unit_cost)}</td></tr>
          `).join('')}</tbody>
        </table>
      </div>
    `;
    document.getElementById('page-content').innerHTML = html;
  } catch (e) {
    document.getElementById('page-content').innerHTML = '<div class="empty">' + e.message + '</div>';
  }
}

function filterTable(input, tableId) {
  const q = input.value.toLowerCase();
  document.querySelectorAll(`#${tableId} tbody tr`).forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

// إغلاق المودال بالنقر خارجها
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

// تحميل أولي مع الصلاحيات واللغة
async function initApp() {
  // تحميل الصلاحيات والترجمات (إن كانت modules.js محمّلة)
  if (typeof loadMyPermissions === 'function') {
    try { await loadMyPermissions(); } catch(e) {}
  }
  // مبدّل اللغة أُزيل من الواجهة - تُحدد لغة المستخدم تلقائياً من قاعدة البيانات
  // (عمران=أوردو، daryl/rose=إنجليزي، الباقي=عربي)

  // فلترة الشريط الجانبي حسب الصلاحية (لو متاح)
  if (window.CURRENT_PERMS && window.CURRENT_PERMS.menu && window.CURRENT_PERMS.menu !== '*') {
    const allowedSet = new Set(window.CURRENT_PERMS.menu);
    document.querySelectorAll('.nav-item').forEach(item => {
      const page = item.dataset.page;
      // المالكة والمدير العام يشاهدون كل شي (menu === '*')
      if (window.CURRENT_PERMS.is_super) return;
      if (page && !allowedSet.has(page)) item.style.display = 'none';
    });
  }
  loadTopBarStats();
  loadAlerts();
  renderPage();
  // أخفِ نتائج البحث عند الضغط خارجها
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.top-search-wrap')) {
      const r = document.getElementById('globalSearchResults');
      if (r) r.classList.remove('show');
    }
  });
  // اختصارات لوحة المفاتيح
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
      e.preventDefault();
      document.getElementById('globalSearch')?.focus();
    }
    if (e.key === 'Escape') {
      const r = document.getElementById('globalSearchResults');
      if (r) r.classList.remove('show');
    }
  });
}

// ============ بحث عام عبر الكيانات ============
let __globalSearchCache = null;
let __globalSearchTimer = null;
async function globalSearchHandler(q) {
  const box = document.getElementById('globalSearchResults');
  if (!box) return;
  q = (q || '').trim().toLowerCase();
  if (q.length < 2) { box.classList.remove('show'); return; }

  if (__globalSearchTimer) clearTimeout(__globalSearchTimer);
  __globalSearchTimer = setTimeout(async () => {
    try {
      // حمّل البيانات أول مرة فقط، ثم استعمل الكاش
      if (!__globalSearchCache) {
        const [customers, events, inventory, appts] = await Promise.all([
          api('/customers').catch(()=>[]),
          api('/events').catch(()=>[]),
          api('/inventory').catch(()=>[]),
          api('/appointments').catch(()=>[]),
        ]);
        __globalSearchCache = { customers, events, inventory, appts };
        // امسح الكاش بعد دقيقة
        setTimeout(() => { __globalSearchCache = null; }, 60000);
      }
      const D = __globalSearchCache;
      const matchCust = D.customers.filter(c =>
        (c.full_name||'').toLowerCase().includes(q) ||
        (c.phone||'').includes(q) ||
        (c.email||'').toLowerCase().includes(q)).slice(0, 5);
      const matchEv = D.events.filter(e =>
        (e.title||'').toLowerCase().includes(q) ||
        (e.event_code||'').toLowerCase().includes(q) ||
        (e.operation_order||'').toLowerCase().includes(q) ||
        (e.customer_name||'').toLowerCase().includes(q)).slice(0, 5);
      const matchInv = D.inventory.filter(i =>
        (i.name||'').toLowerCase().includes(q) ||
        (i.item_code||'').toLowerCase().includes(q)).slice(0, 5);
      const matchAppt = D.appts.filter(a =>
        (a.title||'').toLowerCase().includes(q) ||
        (a.appointment_code||'').toLowerCase().includes(q) ||
        (a.customer_name||'').toLowerCase().includes(q)).slice(0, 3);

      let html = '';
      if (matchCust.length) {
        html += '<div class="gsr-section">👥 العملاء</div>' + matchCust.map(c => `
          <div class="gsr-item" onclick="gsrOpen('customer',${c.id})">
            <span class="gsr-icon">👤</span>
            <div class="gsr-text"><strong>${c.full_name}</strong><small>${c.phone || '-'} • ${c.city || ''}</small></div>
          </div>`).join('');
      }
      if (matchEv.length) {
        html += '<div class="gsr-section">🎉 المناسبات</div>' + matchEv.map(e => `
          <div class="gsr-item" onclick="gsrOpen('event',${e.id})">
            <span class="gsr-icon">🎉</span>
            <div class="gsr-text"><strong>${e.title}</strong><small>${e.event_code} • ${e.customer_name} • ${e.event_date || '-'}</small></div>
          </div>`).join('');
      }
      if (matchInv.length) {
        html += '<div class="gsr-section">📦 المخزون</div>' + matchInv.map(i => `
          <div class="gsr-item" onclick="gsrOpen('inventory',${i.id})">
            <span class="gsr-icon">📦</span>
            <div class="gsr-text"><strong>${i.name}</strong><small>${i.item_code} • ${i.warehouse} • متاح ${i.quantity_available}</small></div>
          </div>`).join('');
      }
      if (matchAppt.length) {
        html += '<div class="gsr-section">📅 المواعيد</div>' + matchAppt.map(a => `
          <div class="gsr-item" onclick="gsrOpen('appointment',${a.id})">
            <span class="gsr-icon">📅</span>
            <div class="gsr-text"><strong>${a.title}</strong><small>${a.appointment_code} • ${a.appointment_date} ${a.start_time || ''}</small></div>
          </div>`).join('');
      }
      if (!html) html = '<div class="gsr-item" style="color:var(--text-light)">لا نتائج لـ "' + q + '"</div>';
      box.innerHTML = html;
      box.classList.add('show');
    } catch(e) { console.error(e); }
  }, 200);
}
function gsrOpen(type, id) {
  document.getElementById('globalSearchResults').classList.remove('show');
  document.getElementById('globalSearch').value = '';
  if (type === 'customer') { currentPage='customers'; renderPage(); setTimeout(()=>typeof showCustomerDetails==='function'&&showCustomerDetails(id), 200); }
  else if (type === 'event') { currentPage='events'; renderPage(); setTimeout(()=>typeof showEventDetails==='function'&&showEventDetails(id), 200); }
  else if (type === 'inventory') { currentPage='inventory'; renderPage(); setTimeout(()=>typeof showItemDetails==='function'&&showItemDetails(id), 200); }
  else if (type === 'appointment') { currentPage='appointments'; renderPage(); }
}

// ============ شريط الإحصائيات العلوي ============
async function loadTopBarStats() {
  try {
    const events = await api('/events');
    const today = new Date().toISOString().split('T')[0];
    const todayCount = events.filter(e => (e.actual_date || e.event_date) === today && e.status !== 'cancelled').length;
    const weekFromNow = new Date(); weekFromNow.setDate(weekFromNow.getDate() + 7);
    const weekStr = weekFromNow.toISOString().split('T')[0];
    const weekCount = events.filter(e => {
      const d = e.actual_date || e.event_date;
      return d > today && d <= weekStr && e.status !== 'cancelled';
    }).length;
    const el = document.getElementById('todayStat');
    if (el) {
      el.innerHTML = todayCount > 0
        ? `🔥 <strong>${todayCount}</strong> اليوم • ⏰ <strong>${weekCount}</strong> هذا الأسبوع`
        : `📅 <strong>${weekCount}</strong> مناسبة هذا الأسبوع`;
    }
  } catch(e) {}
}

// ============ التنبيهات الذكية ============
async function loadAlerts() {
  try {
    const alerts = [];
    // غير الإدارة: تنبيهات مهام قسمه فقط (المتأخرة والقريبة)
    if (typeof isTop === 'function' && !isTop()) {
      try {
        const mine = await api('/ops/mytasks');
        mine.filter(t => t.late || t.soon).slice(0, 10).forEach(t => alerts.push({
          icon: t.late ? '⏰' : '🔔', type: t.late ? 'danger' : 'warning',
          title: t.late ? 'مهمة متأخرة' : 'مهمة قريبة', msg: `${t.O || ''} · ${t.title}`,
          action: () => { location.href = '/operations'; }
        }));
      } catch (e) {}
      window.__currentAlerts = alerts;
      const b = document.getElementById('alertBadge');
      if (b) { b.textContent = alerts.length; b.style.display = alerts.length ? 'flex' : 'none'; }
      return;
    }
    const [events, inv] = await Promise.all([api('/events'), api('/inventory')]);
    const today = new Date().toISOString().split('T')[0];
    // مناسبات بدون خطة عمل
    try {
      const plans = await api('/workplans');
      const planEventIds = new Set(plans.map(p => p.event_id));
      events.filter(e => !planEventIds.has(e.id) && e.status !== 'cancelled' && e.event_date >= today)
        .slice(0, 5).forEach(e => alerts.push({
          icon: '⚠️', type: 'warning',
          title: 'مناسبة بدون خطة عمل', msg: `${e.event_code} - ${e.title}`,
          action: () => { currentPage='work_plans'; renderPage(); }
        }));
    } catch(e){}
    // مخزون قليل
    inv.filter(i => i.quantity_available <= 1 && i.quantity_total > 0)
      .slice(0, 5).forEach(i => alerts.push({
        icon: '📉', type: 'warning',
        title: 'مخزون قليل', msg: `${i.item_code} - ${i.name} (متبقي ${i.quantity_available})`,
        action: () => { currentPage='inventory'; renderPage(); setTimeout(()=>showItemDetails(i.id), 200); }
      }));
    // مخزون متضرر
    inv.filter(i => ['damaged','lost'].includes(i.condition))
      .slice(0, 3).forEach(i => alerts.push({
        icon: '❌', type: 'danger',
        title: 'مخزون تالف', msg: `${i.item_code} - ${i.name} (${i.condition})`,
        action: () => { currentPage='inventory'; renderPage(); setTimeout(()=>showItemDetails(i.id), 200); }
      }));
    // مناسبات اليوم
    events.filter(e => (e.actual_date || e.event_date) === today && e.status !== 'cancelled')
      .forEach(e => alerts.push({
        icon: '🔥', type: 'critical',
        title: 'مناسبة اليوم!', msg: `${e.event_code} - ${e.title}`,
        action: () => { currentPage='events'; renderPage(); setTimeout(()=>showEventDetails(e.id), 200); }
      }));
    window.__currentAlerts = alerts;
    const badge = document.getElementById('alertBadge');
    if (badge) {
      if (alerts.length > 0) {
        badge.textContent = alerts.length;
        badge.style.display = 'flex';
      } else {
        badge.style.display = 'none';
      }
    }
  } catch(e) {}
}
function showAlerts() {
  const alerts = window.__currentAlerts || [];
  if (alerts.length === 0) {
    openModal('🔔 التنبيهات', '<p style="text-align:center;padding:40px;color:var(--text-light)">✓ لا توجد تنبيهات. كل شي تمام!</p>',
      '<button class="btn btn-outline" onclick="closeModal()">إغلاق</button>');
    return;
  }
  const colors = { critical: '#FECACA', danger: '#FEE2E2', warning: '#FEF3C7', info: '#DBEAFE' };
  const body = alerts.map((a, i) => `
    <div onclick="closeModal();window.__currentAlerts[${i}].action()"
         style="cursor:pointer;padding:14px;border-radius:8px;background:${colors[a.type]||colors.info};
                margin-bottom:8px;display:flex;gap:12px;align-items:center">
      <span style="font-size:24px">${a.icon}</span>
      <div style="flex:1">
        <strong>${a.title}</strong>
        <div style="font-size:12px;color:var(--text-light);margin-top:2px">${a.msg}</div>
      </div>
      <span style="color:var(--text-light)">›</span>
    </div>
  `).join('');
  openModal(`🔔 التنبيهات (${alerts.length})`, body,
    '<button class="btn btn-outline" onclick="closeModal()">إغلاق</button>');
}
