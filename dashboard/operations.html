<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>أبيلا — إدارة العمليات</title>
<style>
:root{
  --bg:#F8F4ED;--card:#FFFFFF;--line:#E7DDCF;--soft:#F3EEE4;--cream:#F3ECDD;
  --ink:#3E2C1C;--ink2:#5C4528;--mut:#8A7A66;--brand:#8B6F47;--gold:#B8975D;--gold2:#D4B97A;
  --red:#A04545;--redbg:#F7E6E3;--amb:#B57A1E;--ambbg:#FBF0DC;--grn:#4F7A4A;--grnbg:#E7F0E3;--blu:#3F6A8A;--blubg:#E3EDF4;
  --shadow:0 1px 2px rgba(62,44,28,.06),0 4px 14px rgba(62,44,28,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1712;--card:#26201A;--line:#3A3128;--soft:#2E2720;--cream:#332A21;
    --ink:#F1E8DC;--ink2:#E2D3BF;--mut:#A8977F;--brand:#C9A878;--gold:#D4B97A;--gold2:#8E7550;
    --red:#E08A80;--redbg:#3B2420;--amb:#E2B060;--ambbg:#3A2E1A;--grn:#9CC48F;--grnbg:#22301F;--blu:#8FB6D6;--blubg:#1E2A33;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#1C1712;--card:#26201A;--line:#3A3128;--soft:#2E2720;--cream:#332A21;
  --ink:#F1E8DC;--ink2:#E2D3BF;--mut:#A8977F;--brand:#C9A878;--gold:#D4B97A;--gold2:#8E7550;
  --red:#E08A80;--redbg:#3B2420;--amb:#E2B060;--ambbg:#3A2E1A;--grn:#9CC48F;--grnbg:#22301F;--blu:#8FB6D6;--blubg:#1E2A33;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;object-fit:contain}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:17px;color:var(--ink2)}
.ttl small{color:var(--mut);font-size:12px}
.chip-me{font-size:12px;background:var(--cream);border:1px solid var(--line);padding:5px 10px;border-radius:999px;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;color:var(--ink2)}
.icon-btn svg{width:18px;height:18px}
nav.tabs{display:flex;gap:6px;max-width:1100px;margin:0 auto;padding:0 16px 10px;overflow-x:auto}
nav.tabs button{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:999px;white-space:nowrap;color:var(--ink2)}
nav.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);text-align:right;cursor:pointer}
.kpi b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mut)}
.kpi.red b{color:var(--red)} .kpi.amb b{color:var(--amb)} .kpi.blu b{color:var(--blu)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.bar input[type=search]{flex:1;min-width:180px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pill{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px;font-size:13px;white-space:nowrap;color:var(--ink2)}
.pill.on{background:var(--ink2);color:var(--bg);border-color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.ocard{padding:14px 16px 12px 14px;cursor:pointer}
.ocard::before{content:"";position:absolute;inset:0 0 0 auto;width:5px;background:var(--grn)}
.ocard.h-red::before{background:var(--red)} .ocard.h-amber::before{background:var(--amb)} .ocard.h-grey::before{background:var(--line)}
.orow{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.oname{font-weight:700;font-size:16px}
.onum{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--ink2);white-space:nowrap;border:1px solid transparent}
.b-red{background:var(--redbg);color:var(--red)} .b-amb{background:var(--ambbg);color:var(--amb)} .b-grn{background:var(--grnbg);color:var(--grn)} .b-blu{background:var(--blubg);color:var(--blu)}
.b-out{background:transparent;border-color:var(--line)}
.meta{color:var(--mut);font-size:13px;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.meta b{color:var(--ink2);font-weight:600}
.gates{display:flex;gap:3px;margin:12px 0 6px}
.gates i{flex:1;height:6px;border-radius:3px;background:var(--soft)}
.gates i.done{background:var(--grn)} .gates i.late{background:var(--red)} .gates i.cur{background:var(--gold2)}
.gl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut)}
.alert{margin-top:8px;font-size:12.5px;color:var(--red);display:flex;gap:6px;align-items:flex-start}
.depts{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.depts span{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--ink2)}
.depts span.l{background:var(--redbg);color:var(--red)}
.dot{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-size:11px;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.empty{padding:40px 16px;text-align:center;color:var(--mut)}
/* detail */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--brand);padding:12px 0 6px;font-weight:600}
.dhead{padding:16px}
.dhead h2{margin:0;font-size:20px;color:var(--ink2)}
.dates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.dbox{background:var(--soft);border-radius:12px;padding:9px 11px}
.dbox span{display:block;font-size:11.5px;color:var(--mut)}
.dbox b{font-size:14px;font-variant-numeric:tabular-nums}
.dbox.hl{background:var(--cream);outline:1px solid var(--gold2)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;font-weight:600;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.red{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.stepper{display:flex;overflow-x:auto;gap:0;padding:14px 12px;margin-top:12px}
.step{flex:1;min-width:76px;text-align:center;position:relative;font-size:12px}
.step::before{content:"";position:absolute;top:12px;right:50%;width:100%;height:2px;background:var(--line);z-index:0}
.step:first-child::before{display:none}
.step .c{width:26px;height:26px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--card);border:2px solid var(--line);position:relative;z-index:1;font-size:12px;font-weight:700;color:var(--mut)}
.step.done .c{background:var(--grn);border-color:var(--grn);color:#fff}
.step.late .c{background:var(--red);border-color:var(--red);color:#fff}
.step.cur .c{border-color:var(--gold);color:var(--gold)}
.step small{display:block;color:var(--mut);font-size:10.5px;font-variant-numeric:tabular-nums}
.sec{margin-top:14px}
.sec h3{font-size:15px;margin:0 0 8px;color:var(--ink2)}
.subtabs{display:flex;gap:6px;margin:16px 0 10px;overflow-x:auto}
.daygrp{margin:14px 0 6px;font-size:13px;color:var(--mut);font-weight:700;display:flex;gap:8px;align-items:center}
.daygrp::after{content:"";flex:1;height:1px;background:var(--line)}
.task{display:flex;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);align-items:flex-start}
.task:last-child{border-bottom:0}
.task .st{flex:0 0 auto}
.stbtn{border:1.5px solid var(--line);background:var(--card);border-radius:8px;font-size:12px;padding:4px 8px;min-width:64px;font-weight:600}
.s-todo{color:var(--mut)} .s-doing{color:var(--blu);border-color:var(--blu);background:var(--blubg)}
.s-done{color:var(--grn);border-color:var(--grn);background:var(--grnbg)} .s-stuck{color:var(--red);border-color:var(--red);background:var(--redbg)}
.s-cancel{color:var(--mut);text-decoration:line-through}
.task .bd{flex:1;min-width:0}
.task .tt{font-weight:600;font-size:14px}
.task.isdone .tt{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--line)}
.task .ds{font-size:12.5px;color:var(--mut);margin-top:3px;word-break:break-word}
.task .tm{font-size:12px;margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tm .due{font-variant-numeric:tabular-nums;color:var(--ink2)}
.tm .due.late{color:var(--red);font-weight:700} .tm .due.soon{color:var(--amb);font-weight:700}
.note{margin-top:6px;font-size:12.5px;background:var(--soft);border-radius:8px;padding:6px 9px;color:var(--ink2)}
.more{margin-top:8px;display:none;gap:8px;flex-direction:column}
.task.open .more{display:flex}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mut)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 10px;font-size:14px;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.deptacc{margin-bottom:10px}
.deptacc summary{list-style:none;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:700;color:var(--ink2)}
.deptacc summary::-webkit-details-marker{display:none}
.prog{height:5px;background:var(--soft);border-radius:3px;overflow:hidden;width:90px;display:inline-block;vertical-align:middle;margin-inline-start:8px}
.prog i{display:block;height:100%;background:var(--grn)}
/* chat */
.chans{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding:12px}
.msg{max-width:82%;padding:8px 11px;border-radius:12px;background:var(--soft);font-size:14px;align-self:flex-start;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--cream)}
.msg small{display:block;font-size:11px;color:var(--mut);margin-bottom:2px}
.send{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.send textarea{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;resize:none;height:42px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .hd{font-size:11.5px;color:var(--mut);text-align:center;padding:4px 0}
.cell{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:74px;padding:6px;font-size:12px;cursor:pointer;position:relative}
.cell .n{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2)}
.cell .m{font-size:10.5px;color:var(--mut)}
.cell.blk{background:repeating-linear-gradient(135deg,var(--soft),var(--soft) 6px,var(--card) 6px,var(--card) 12px)}
.cell.today{outline:2px solid var(--gold)}
.cell.over{border-color:var(--red);background:var(--redbg)}
.cell.warn{border-color:var(--amb)}
.cbar{display:flex;gap:2px;margin-top:6px;flex-wrap:wrap}
.cbar i{width:10px;height:10px;border-radius:3px;background:var(--brand)}
.cbar i.w{background:transparent;border:1.5px dashed var(--gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:10px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:middle;margin-inline-end:4px;background:var(--brand)}
.legend i.w{background:transparent;border:1.5px dashed var(--gold)}
/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(30,20,10,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px 22px;max-height:92vh;overflow-y:auto}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 12px;color:var(--ink2)}
.sheet .field{margin-bottom:10px}
.calc{border-radius:10px;padding:10px 12px;font-size:13px;margin:6px 0 12px;line-height:1.7}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.toast.err{background:var(--red);color:#fff}
.loading{padding:60px 16px;text-align:center;color:var(--mut)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.team td,.team th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-size:13.5px}
.team th{color:var(--mut);font-weight:600;font-size:12px}
.team{width:100%;border-collapse:collapse}
.lockico{color:var(--red)}
.pinbox{max-width:360px;margin:28px auto;padding:26px 22px;text-align:center}
.pinbox h2{margin:6px 0 4px;color:var(--ink2);font-size:19px}
.pinbox p{color:var(--mut);font-size:13.5px;margin:0 0 6px;line-height:1.6}
.pinlogo{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto}
.pdots{display:flex;gap:14px;justify-content:center;margin:18px 0 8px}
.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold);display:block}
.pdots i.on{background:var(--brand);border-color:var(--brand)}
.pmsg{font-size:13px;min-height:20px;color:var(--mut);margin-bottom:10px}
.pmsg.err{color:var(--red)}
.pkeys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr}
.pkeys button{height:58px;border-radius:14px;border:1px solid var(--line);background:var(--soft);font-size:22px;font-weight:600;color:var(--ink2)}
.pkeys button:active{background:var(--cream)}
.chip-me{cursor:pointer}
.demo{position:fixed;bottom:12px;right:12px;z-index:40;background:var(--card);border:1px solid var(--gold2);border-radius:12px;padding:6px 8px;box-shadow:var(--shadow);font-size:12px;display:none;align-items:center;gap:6px}
.demo select{border:1px solid var(--line);border-radius:8px;padding:4px;background:var(--card)}
@media (max-width:760px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .kpis .kpi:nth-child(n+4){grid-column:span 1}
  .dates{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:1fr}
  .cell{min-height:58px;padding:4px}
  .cell .m{display:none}
  .ttl small{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <img class="logo" id="logo" alt="">
    <div class="ttl"><b>إدارة العمليات</b><small>شركة أبيلا للأفراح والمناسبات</small></div>
    <span class="chip-me" id="me">…</span>
    <button class="icon-btn" id="btnRefresh" title="تحديث" aria-label="تحديث"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main class="wrap" id="main"><div class="loading"><div class="spin"></div>جارٍ التحميل…</div></main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="demo" id="demo"><span>معاينة بصفة:</span><select id="demoUser"></select></div>

<script src="/assets/session.js"></script>
<script>
/* منصّة أبيلا — جسر google.script.run → /api/ops/call (الدخول من حساب المنصة) */
(function(){
  function runner(ok, fail){
    return new Proxy({}, { get(_, prop){
      if (prop === 'withSuccessHandler') return f => runner(f, fail);
      if (prop === 'withFailureHandler') return f => runner(ok, f);
      return (...args) => {
        const a = prop === 'api_logo' ? [] : args.slice(2);
        fetch('/api/ops/call', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ fn: prop, args: a }) })
          .then(r => { if (r.status === 401) { location.href = '/dashboard/'; throw new Error('سجّل الدخول من المنصة أولاً'); } return r.json(); })
          .then(j => { if (!ok) return; ok(prop === 'api_logo' ? (j && j.data) : j); }).catch(e => fail && fail(e));
      };
    }});
  }
  window.google = { script: { run: runner(null, null) } };
})();
</script>

<script>
(function () {
'use strict';
var U = '', KEY = '', TOK = '', S = { view: 'board', filter: 'all', q: '', order: null, sub: 'timeline', chan: null, off: 0, openTask: {} };
var DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
var MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
var DAYMS = 86400000;
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function p2(n) { return (n < 10 ? '0' : '') + n; }
function D(s) { var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : NaN; }
function fmtD(ms) { var d = new Date(ms); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()); }
function addD(s, n) { return fmtD(D(s) + n * DAYMS); }
function nowR() { return Date.now() + S.off; }
function today() { return fmtD(nowR()); }
function diffD(a, b) { return Math.round((D(a) - D(b)) / DAYMS); }
function isBiz(s) { var w = new Date(D(s)).getUTCDay(); return w !== 5 && w !== 6; }
function addBiz(s, n) { var d = s, c = 0; while (c < n) { d = addD(d, 1); if (isBiz(d)) c++; } return d; }
function dayName(s) { return DAYS[new Date(D(s)).getUTCDay()]; }
function nice(s) { if (!s) return '—'; var d = new Date(D(s)); return dayName(s) + ' ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()]; }
function short(s) { if (!s) return '—'; var d = new Date(D(s)); return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()]; }
function rel(s) {
  if (!s) return ''; var n = diffD(s, today());
  if (n === 0) return 'اليوم'; if (n === 1) return 'بكرة'; if (n === -1) return 'أمس';
  if (n === 2) return 'بعد يومين'; if (n === -2) return 'قبل يومين';

function bindTasks(root) {

        if (a === 'cancel') { if (!window.confirm('إلغاء هذه المهمة؟')) return; return patchTask(t, { status: 'ملغاة' }); }

function patchTask(t, p) {

function silentMine() { call('refresh').then(function (d) { Object.assign(DATA, d); renderMine(); }).catch(function () { }); }
function renderMine() {
  var cards = DATA.cards || [], all = [];
  cards.forEach(function (c) { c.tasks.forEach(function (t) { all.push(t); }); });
  var open = all.filter(function (t) { return !t.done; });
  var lateN = open.filter(function (t) { return t.late; }).length;
  var todayN = open.filter(function (t) { return t.due === today() && !t.tentative; }).length;

  var showDone = S.filter === 'done';
  var h = '<div class="kpis" style="grid-template-columns:repeat(3,1fr)">' + kpi('late', lateN, 'متأخرة', 'red') + kpi('today', todayN, 'اليوم', 'amb') + kpi('week', weekN, 'خلال أسبوع', 'blu') + '</div>' +
    '<div class="pills" style="margin-bottom:12px"><button class="pill ' + (!showDone ? 'on' : '') + '" data-f="open">المفتوحة</button><button class="pill ' + (showDone ? 'on' : '') + '" data-f="done">الكل مع المنجز</button></div>';
  var list = cards.map(function (c) {
    var ts = c.tasks.filter(function (t) { return showDone || !t.done; });

    '<div class="card" style="overflow-x:auto"><table class="team"><tr><th>الاسم</th><th>الدور</th><th>الأقسام</th><th>المصدر</th><th></th></tr>' +
    d.members.map(function (m, i) {
      if (m.super) return '<tr><td><b>' + esc(m.name) + '</b></td><td>الإدارة</td><td>—</td><td>' + esc(m.src) + '</td><td></td></tr>';
      var dis = DATA.me.isAdmin ? '' : ' disabled';
      return '<tr data-m="' + i + '"><td><b>' + esc(m.name) + '</b><div style="font-size:11px;color:var(--mut)">' + esc(m.username) + '</div></td>' +
        '<td><select class="mrole"' + dis + '><option value="">— بدون —</option>' + d.roles.map(function (r) { return '<option' + (r === m.role ? ' selected' : '') + '>' + esc(r) + '</option>'; }).join('') + '</select></td>' +
        '<td>' + d.depts.map(function (x) { return '<label style="white-space:nowrap;margin-left:8px;font-size:12px"><input type="checkbox" class="mdep" value="' + esc(x) + '"' + ((m.depts || '').indexOf(x) >= 0 ? ' checked' : '') + dis + '> ' + esc(x) + '</label>'; }).join('') + '</td>' +
        '<td style="font-size:12px;color:var(--mut)">' + esc(m.src || '') + (m.active ? '' : ' · <span class="badge b-out">موقوف</span>') + '</td>' +
        '<td>' + (DATA.me.isAdmin ? '<button class="btn sm" data-save="' + i + '">حفظ</button>' : '') + '</td></tr>';
    }).join('') + '</table></div></div>';
  $('#main').innerHTML = h;
  $$('[data-save]').forEach(function (b) {
    b.onclick = function () {
      var i = +b.getAttribute('data-save'), tr = document.querySelector('tr[data-m="' + i + '"]'), m = d.members[i];
      var deps = Array.prototype.slice.call(tr.querySelectorAll('.mdep:checked')).map(function (x) { return x.value; });
      call('setMember', m.username, tr.querySelector('.mrole').value, deps, true).then(function () { toast('حُفظ ' + m.name); renderTeam(); }).catch(function (e) { toast(e.message, true); });
    };
  });
}
function renderLog() {
  $('#main').innerHTML = '<div class="loading"><div class="spin"></div></div>';
  call('log', '').then(function (rows) {
    $('#main').innerHTML = '<div class="sec"><h3>آخر الإجراءات</h3><div class="card">' + (rows.length ? rows.map(function (r) {
      return '<div class="task"><div class="bd"><div class="tt">' + esc(r.action) + ' <span class="onum">' + esc(r.Q) + '</span></div><div class="ds">' + esc(r.details) + '</div><div class="tm"><span class="due">' + esc(r.at) + '</span><span class="badge b-out">' + esc(r.by) + '</span></div></div></div>';
    }).join('') : '<div class="empty">لا يوجد</div>') + '</div></div>';
  }).catch(function (e) { toast(e.message, true); });
}

/* ───────── الرمز السري ───────── */
function tokName() { return 'abella_ops_tok_' + U; }
function tokGet() { try { return localStorage.getItem(tokName()) || ''; } catch (e) { return ''; } }
function tokSet(t) { TOK = t || ''; try { if (t) localStorage.setItem(tokName(), t); else localStorage.removeItem(tokName()); } catch (e) { } }
function showPin(mode) {
  clearInterval(boot._p); closeModal();
  tokSet('');
  $('#tabs').innerHTML = ''; $('#me').textContent = U || '…';
  var step = mode === 'SET_PIN' ? 'set' : mode === 'LOCKED' ? 'locked' : 'enter', first = '', val = '';
  function draw(msg, err) {
    var ttl = step === 'set' ? 'اختر رمزك السري' : step === 'confirm' ? 'أعد إدخال الرمز للتأكيد' : step === 'locked' ? 'الحساب مقفل' : 'أدخل رمزك السري';
    var sub = step === 'set' ? 'أول دخول لك — اختر 4 أرقام تتذكرها. لا تشاركها مع أحد.' : step === 'locked' ? 'تجاوزت عدد المحاولات. اطلب من إدارة العمليات تصفير رمزك.' : step === 'confirm' ? '' : 'أهلاً ' + esc(U);
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'];
    $('#main').innerHTML = '<div class="pinbox card">' + ($('#logo').getAttribute('src') ? '<img class="pinlogo" src="' + $('#logo').getAttribute('src') + '" alt="">' : '<div class="pinlogo"></div>') + '<h2>' + ttl + '</h2><p>' + sub + '</p>' +
      (step === 'locked' ? '' : '<div class="pdots">' + [0, 1, 2, 3].map(function (i) { return '<i class="' + (i < val.length ? 'on' : '') + '"></i>'; }).join('') + '</div>' +
        '<div class="pmsg ' + (err ? 'err' : '') + '">' + (msg || '&nbsp;') + '</div>' +
        '<div class="pkeys">' + keys.map(function (k) { return k ? '<button data-k="' + k + '">' + k + '</button>' : '<span></span>'; }).join('') + '</div>') +
      (window.__DEMO && step !== 'locked' ? '<p style="font-size:12px;color:var(--mut);margin-top:14px">معاينة: الرمز 2580 · «منسقة الورد» بدون رمز لتجربة أول دخول</p>' : '') + '</div>';
    $$('.pkeys button').forEach(function (b) { b.onclick = function () { press(b.getAttribute('data-k')); }; });
  }
  function press(k) {
    if (busy) return;
    if (k === '⌫') { val = val.slice(0, -1); return draw(); }
    if (val.length >= 4) return;
    val += k; draw();
    if (val.length === 4) setTimeout(submit, 120);
  }
  var busy = false;
  function submit() {
    if (step === 'set') { first = val; val = ''; step = 'confirm'; return draw(); }
    if (step === 'confirm' && val !== first) { val = ''; first = ''; step = 'set'; return draw('الرمزان غير متطابقين — حاول مرة ثانية', true); }
    busy = true; draw('جارٍ التحقق…');
    call(step === 'confirm' ? 'setPin' : 'login', val).then(function (r) {
      busy = false; tokSet(r.token); boot();
    }).catch(function (e) {
      busy = false; val = '';
      if (step === 'confirm') { step = 'set'; first = ''; }
      if (/انقفل|مقفل/.test(e.message)) step = 'locked';
      draw(e.message, true);
    });
  }
  document.onkeydown = function (e) { if (!$('.pkeys')) return; if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('⌫'); };
  draw();
}
$('#me').onclick = function () {
  if (window.__HUB__) { location.href = '/dashboard/'; return; }
  if (!DATA || !window.confirm('تسجيل الخروج من هذا الجهاز؟')) return;
  call('logout').then(function () { tokSet(''); showPin('NEED_PIN'); }).catch(function () { tokSet(''); showPin('NEED_PIN'); });
};

/* ───────── modal ───────── */
function openModal(html) { $('#sheet').innerHTML = html; $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); }
$('#modal').onclick = function (e) { if (e.target === $('#modal')) closeModal(); };

/* api_ prefix */
var _call = call;
call = function (fn) { var a = Array.prototype.slice.call(arguments); a[0] = 'api_' + fn; return _call.apply(null, a); };

window.__opsApp = { boot: boot, setUser: function (u, k) { U = u; KEY = k; TOK = tokGet(); S = { view: 'board', filter: 'all', q: '', order: null, sub: 'timeline', chan: null, off: 0, openTask: {} }; boot(); } };
if (window.google && google.script && google.script.url) start();
else { window.__HUB__ = true; var hb = document.createElement('div'); hb.id = 'hubbar'; hb.innerHTML = '<a href="/dashboard/">← منصّة أبيلا</a> · إدارة العمليات — الدخول من حسابك في المنصة، الأوامر من العقود، والمهام حسب الشروط وخطة العمل المعتمدة — كل قسم يشوف مهامه.'; document.body.insertBefore(hb, document.body.firstChild); window.__opsApp.setUser('hub', 'hub'); }
})();
</script>
